<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伝説のまもりびと - 横スクロールタワーディフェンス</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a2a1a;
  color: #e0ffe0;
  font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  user-select: none;
}

#app-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: top center;
}

#game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 960px;
  padding: 8px 16px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border-bottom: 2px solid #4a8a2a;
}

#game-header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hud-info {
  display: flex;
  gap: 20px;
  font-size: 14px;
}

.hud-info span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.gold-icon { color: #ffd700; }
.life-icon { color: #ff4444; }
.wave-icon { color: #44aaff; }

#game-container {
  position: relative;
  display: flex;
  gap: 0;
}

canvas {
  display: block;
  cursor: pointer;
  border: 2px solid #4a8a2a;
  border-right: none;
}

#side-panel {
  width: 200px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border: 2px solid #4a8a2a;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 600px;
  overflow-y: auto;
}

#side-panel h3 {
  font-size: 14px;
  text-align: center;
  color: #ffd700;
  border-bottom: 1px solid #4a8a2a;
  padding-bottom: 6px;
}

.ally-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  color: #e0ffe0;
}

.ally-btn:hover {
  background: rgba(74, 138, 42, 0.6);
  transform: scale(1.02);
}

.ally-btn.selected {
  background: rgba(255, 215, 0, 0.2);
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.ally-btn .ally-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.ally-btn .ally-name {
  font-size: 12px;
  font-weight: bold;
}

.ally-btn .ally-desc {
  font-size: 10px;
  color: #a0c090;
  text-align: center;
  margin-top: 2px;
}

#ally-info {
  background: rgba(0,0,0,0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  padding: 8px;
  font-size: 11px;
  display: none;
}

#ally-info h4 {
  color: #ffd700;
  margin-bottom: 4px;
}

#ally-info .stat {
  display: flex;
  justify-content: space-between;
  margin: 2px 0;
}

.speed-btn {
  padding: 4px 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 4px;
  color: #e0ffe0;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}

.speed-btn.active {
  background: rgba(255, 215, 0, 0.3);
  border-color: #ffd700;
}

#game-over-overlay, #victory-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 760px; height: 600px;
  background: rgba(0, 0, 0, 0.85);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#game-over-overlay h2 {
  font-size: 48px;
  color: #ff4444;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff0000;
}

#victory-overlay h2 {
  font-size: 48px;
  color: #ffd700;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ffaa00;
}

#game-over-overlay p, #victory-overlay p {
  font-size: 18px;
  margin-bottom: 30px;
}

#restart-btn, #restart-btn2, #menu-btn, #menu-btn2 {
  padding: 12px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#restart-btn:hover, #restart-btn2:hover, #menu-btn:hover, #menu-btn2:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* メニュー画面 */
#menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a3a10, #0d1a0d);
  border: 2px solid #4a8a2a;
}

#menu-screen h1 {
  font-size: 48px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 60px;
  text-shadow: none;
}

#menu-buttons {
  display: flex;
  gap: 16px;
}

.menu-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 140px;
  height: 100px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  border: 2px solid;
  transition: all 0.2s;
}

.menu-btn .menu-btn-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.menu-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
}

.menu-btn.btn-sortie {
  background: linear-gradient(180deg, #aa4400, #883300);
  border-color: #ff8800;
}

.menu-btn.btn-sortie:hover {
  background: linear-gradient(180deg, #cc5500, #aa4400);
  box-shadow: 0 0 20px rgba(255, 136, 0, 0.4);
}

.menu-btn.btn-formation {
  background: linear-gradient(180deg, #2a5a8a, #1a3a5a);
  border-color: #4a9aee;
}

.menu-btn.btn-formation:hover {
  background: linear-gradient(180deg, #3a6a9a, #2a5a8a);
  box-shadow: 0 0 20px rgba(74, 154, 238, 0.4);
}

.menu-btn.btn-enhance {
  background: linear-gradient(180deg, #6a2a8a, #4a1a5a);
  border-color: #aa5aee;
}

.menu-btn.btn-enhance:hover {
  background: linear-gradient(180deg, #7a3a9a, #6a2a8a);
  box-shadow: 0 0 20px rgba(170, 90, 238, 0.4);
}

.menu-btn.btn-jobchange {
  background: linear-gradient(180deg, #2a7a3a, #1a5a2a);
  border-color: #4aea5a;
}

.menu-btn.btn-jobchange:hover {
  background: linear-gradient(180deg, #3a8a4a, #2a7a3a);
  box-shadow: 0 0 20px rgba(74, 234, 90, 0.4);
}

.menu-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 編成画面 */
#formation-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a3a10, #0d1a0d);
  border: 2px solid #4a8a2a;
}

#formation-screen h2 {
  font-size: 28px;
  color: #4a9aee;
  margin-bottom: 30px;
}

#formation-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 30px;
}

.formation-slot {
  width: 200px;
  padding: 16px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #4a8a2a;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.formation-slot:hover {
  border-color: #4a9aee;
  background: rgba(74, 154, 238, 0.15);
}

.formation-slot.active {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.formation-slot .slot-label {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 6px;
}

.formation-slot .slot-icon {
  font-size: 36px;
  margin-bottom: 4px;
}

.formation-slot .slot-name {
  font-size: 16px;
  font-weight: bold;
}

.formation-slot .slot-desc {
  font-size: 11px;
  color: #a0c090;
  margin-top: 4px;
}

#job-picker {
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
  max-width: 520px;
}

.job-pick-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 110px;
  padding: 10px 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 2px solid #4a8a2a;
  border-radius: 8px;
  cursor: pointer;
  color: #e0ffe0;
  font-family: inherit;
  transition: all 0.2s;
}

.job-pick-btn:hover {
  background: rgba(74, 138, 42, 0.6);
  transform: scale(1.05);
}

.job-pick-btn .pick-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.job-pick-btn .pick-name {
  font-size: 13px;
  font-weight: bold;
}

#formation-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#formation-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* 強化画面 */
#enhance-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a1a30, #0d0d1a);
  border: 2px solid #aa5aee;
  padding: 20px 0;
  overflow-y: auto;
}

#enhance-screen h2 {
  font-size: 28px;
  color: #aa5aee;
  margin-bottom: 6px;
}

#enhance-crystal-display {
  font-size: 16px;
  color: #ffcc44;
  margin-bottom: 16px;
}

#enhance-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 16px;
}

.enhance-card {
  width: 140px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #555;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.enhance-card:hover {
  border-color: #aa5aee;
  background: rgba(170, 90, 238, 0.1);
}

.enhance-card.selected {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.enhance-card .enh-icon {
  font-size: 30px;
  margin-bottom: 2px;
}

.enhance-card .enh-name {
  font-size: 13px;
  font-weight: bold;
}

.enhance-card .enh-level {
  font-size: 11px;
  color: #ffcc44;
  margin-top: 2px;
}

.enhance-card .enh-level-bar {
  display: flex;
  gap: 2px;
  justify-content: center;
  margin-top: 4px;
}

.enhance-card .enh-pip {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: #333;
  border: 1px solid #555;
}

.enhance-card .enh-pip.filled {
  background: #aa5aee;
  border-color: #cc7aff;
}

#enhance-detail {
  display: none;
  background: rgba(0,0,0,0.5);
  border: 1px solid #aa5aee;
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 16px;
  width: 500px;
  text-align: center;
}

#enhance-detail h3 {
  font-size: 18px;
  color: #ffd700;
  margin-bottom: 8px;
}

#enhance-detail .enh-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 13px;
  margin-bottom: 10px;
}

#enhance-detail .enh-stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

#enhance-detail .enh-stat-label {
  color: #a0c090;
  font-size: 11px;
}

#enhance-detail .enh-stat-arrow {
  color: #44ff44;
}

#enhance-do-btn {
  padding: 8px 24px;
  background: linear-gradient(180deg, #6a2a8a, #4a1a5a);
  border: 2px solid #aa5aee;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

#enhance-do-btn:hover {
  background: linear-gradient(180deg, #7a3a9a, #6a2a8a);
  box-shadow: 0 0 12px rgba(170, 90, 238, 0.4);
}

#enhance-do-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#enhance-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#enhance-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* 武器工房画面 */
#weapon-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #2a1a0a, #1a0d00);
  border: 2px solid #cc8844;
  padding: 16px 0;
  overflow-y: auto;
}

#weapon-screen h2 {
  font-size: 28px;
  color: #cc8844;
  margin-bottom: 4px;
}

#weapon-crystal-display {
  font-size: 14px;
  color: #ffcc44;
  margin-bottom: 12px;
}

#weapon-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  justify-content: center;
  max-width: 900px;
  padding: 0 16px;
}

.weapon-slot {
  width: 100px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #665533;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.weapon-slot:hover {
  border-color: #cc8844;
  background: rgba(204, 136, 68, 0.1);
}

.weapon-slot.selected {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.weapon-slot .ws-job {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 4px;
}

.weapon-slot .ws-icon {
  font-size: 28px;
}

.weapon-slot .ws-name {
  font-size: 12px;
  font-weight: bold;
  margin-top: 2px;
}

.weapon-slot .ws-refine {
  font-size: 11px;
  color: #ffcc44;
}

.weapon-slot .ws-empty {
  font-size: 12px;
  color: #888;
  padding: 8px 0;
}

#weapon-action {
  display: none;
  background: rgba(0,0,0,0.5);
  border: 1px solid #cc8844;
  border-radius: 10px;
  padding: 14px 20px;
  margin-bottom: 12px;
  width: 580px;
  text-align: center;
}

#weapon-action h3 {
  font-size: 16px;
  color: #ffd700;
  margin-bottom: 10px;
}

#weapon-craft-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
}

.craft-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 12px;
  background: rgba(204, 136, 68, 0.2);
  border: 2px solid #886633;
  border-radius: 8px;
  cursor: pointer;
  color: #e0ffe0;
  font-family: inherit;
  transition: all 0.2s;
  width: 100px;
}

.craft-btn:hover {
  background: rgba(204, 136, 68, 0.4);
  border-color: #cc8844;
}

.craft-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.craft-btn .craft-icon { font-size: 24px; }
.craft-btn .craft-name { font-size: 11px; font-weight: bold; }
.craft-btn .craft-desc { font-size: 9px; color: #a0c090; }
.craft-btn .craft-cost { font-size: 10px; color: #ffcc44; }

#weapon-refine-panel {
  text-align: center;
}

#weapon-refine-panel .refine-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 13px;
  margin: 8px 0;
}

#weapon-refine-panel .refine-stat-label {
  color: #a0c090;
  font-size: 11px;
}

#weapon-refine-panel .refine-arrow {
  color: #44ff44;
}

.refine-btn {
  padding: 8px 24px;
  background: linear-gradient(180deg, #8a5a2a, #5a3a1a);
  border: 2px solid #cc8844;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.refine-btn:hover {
  background: linear-gradient(180deg, #aa7a4a, #8a5a2a);
  box-shadow: 0 0 12px rgba(204, 136, 68, 0.4);
}

.refine-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.refine-rate {
  font-size: 12px;
  margin-top: 6px;
}

#refine-result {
  font-size: 14px;
  font-weight: bold;
  margin-top: 8px;
  min-height: 20px;
}

.discard-btn {
  padding: 4px 16px;
  background: rgba(150, 50, 50, 0.3);
  border: 1px solid #cc4444;
  border-radius: 4px;
  color: #ff8888;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
}

.discard-btn:hover { background: rgba(150, 50, 50, 0.6); }

#weapon-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#weapon-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

.menu-btn.btn-weapon {
  background: linear-gradient(180deg, #8a5a2a, #5a3a1a);
  border-color: #cc8844;
}

.menu-btn.btn-weapon:hover {
  background: linear-gradient(180deg, #aa7a4a, #8a5a2a);
  box-shadow: 0 0 20px rgba(204, 136, 68, 0.4);
}

/* 任務選択画面 */
#mission-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a2a0a, #0d1a00);
  border: 2px solid #ff8800;
  padding: 20px 0;
  overflow-y: auto;
}

#mission-screen h2 {
  font-size: 28px;
  color: #ff8800;
  margin-bottom: 16px;
}

#mission-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 24px;
  margin-bottom: 20px;
}

.mission-card {
  width: 180px;
  padding: 14px 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #665522;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.mission-card:hover {
  border-color: #ff8800;
  background: rgba(255, 136, 0, 0.1);
  transform: scale(1.03);
}

.mission-card.selected {
  border-color: #ffd700;
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
}

.mission-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.mission-card.locked:hover {
  transform: none;
  border-color: #665522;
  background: rgba(0,0,0,0.4);
}

.mission-card .mc-icon {
  font-size: 36px;
  margin-bottom: 6px;
}

.mission-card .mc-name {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 4px;
}

.mission-card .mc-desc {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 6px;
}

.mission-card .mc-info {
  font-size: 11px;
  color: #ffcc44;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}

.mission-card .mc-difficulty {
  display: flex;
  gap: 2px;
  justify-content: center;
  margin-top: 4px;
}

.mission-card .mc-star {
  font-size: 12px;
}

.mission-card .mc-star.filled {
  color: #ffd700;
}

.mission-card .mc-star.empty {
  color: #555;

<script>
// ===== オーディオエンジン =====
let audioCtx = null;
let masterGain = null;
let bgmGain = null;
let seGain = null;
let bgmVolume = 0.35;
let seVolume = 0.5;
let audioMuted = false;
let currentBgm = null; // {stop()}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.connect(audioCtx.destination);
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = bgmVolume;
  bgmGain.connect(masterGain);
  seGain = audioCtx.createGain();
  seGain.gain.value = seVolume;
  seGain.connect(masterGain);
}

function ensureAudio() {
  if (!audioCtx) initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function setMuted(m) {
  audioMuted = m;
  if (masterGain) masterGain.gain.value = m ? 0 : 1;
}

function setBgmVolume(v) {
  bgmVolume = v;
  if (bgmGain) bgmGain.gain.value = v;
}

function setSeVolume(v) {
  seVolume = v;
  if (seGain) seGain.gain.value = v;
}

// --- SE (効果音) ---
function playSE(type) {
  ensureAudio();
  const t = audioCtx.currentTime;
  switch (type) {
    case 'hit': playTone(800, 0.06, 'square', 0.15, seGain); break;
    case 'kill': {
      playTone(600, 0.08, 'square', 0.18, seGain);
      playTone(900, 0.08, 'square', 0.15, seGain, 0.06);
      playTone(1200, 0.1, 'square', 0.12, seGain, 0.12);
      break;
    }
    case 'boss_kill': {
      [400,600,800,1000,1200,1400].forEach((f,i) =>
        playTone(f, 0.12, 'square', 0.2, seGain, i*0.06));
      break;
    }
    case 'wave_start': {
      playTone(440, 0.15, 'square', 0.12, seGain);
      playTone(550, 0.15, 'square', 0.12, seGain, 0.12);
      playTone(660, 0.2, 'square', 0.15, seGain, 0.24);
      break;
    }
    case 'victory': {
      const notes = [523,659,784,1047,784,1047];
      notes.forEach((f,i) => playTone(f, 0.18, 'square', 0.2, seGain, i*0.12));
      break;
    }
    case 'defeat': {
      playTone(400, 0.3, 'sawtooth', 0.15, seGain);
      playTone(300, 0.3, 'sawtooth', 0.15, seGain, 0.2);
      playTone(200, 0.5, 'sawtooth', 0.12, seGain, 0.4);
      break;
    }
    case 'click': playTone(1000, 0.04, 'square', 0.08, seGain); break;
    case 'craft': {
      playTone(500, 0.1, 'triangle', 0.15, seGain);
      playTone(800, 0.1, 'triangle', 0.15, seGain, 0.08);
      playTone(1100, 0.15, 'triangle', 0.12, seGain, 0.16);
      break;
    }
    case 'refine_ok': {
      playTone(600, 0.1, 'square', 0.15, seGain);
      playTone(900, 0.1, 'square', 0.15, seGain, 0.08);
      playTone(1200, 0.2, 'sine', 0.2, seGain, 0.16);
      break;
    }
    case 'refine_fail': {
      playTone(400, 0.15, 'sawtooth', 0.12, seGain);
      playTone(250, 0.25, 'sawtooth', 0.1, seGain, 0.1);
      break;
    }
    case 'levelup': {
      [523,659,784,1047].forEach((f,i) =>
        playTone(f, 0.15, 'sine', 0.18, seGain, i*0.08));
      break;
    }
    case 'exam_pass': {
      [440,554,659,880,1047].forEach((f,i) =>
        playTone(f, 0.15, 'square', 0.2, seGain, i*0.1));
      break;
    }
    case 'exam_fail': {
      playTone(350, 0.2, 'sawtooth', 0.15, seGain);
      playTone(200, 0.4, 'sawtooth', 0.1, seGain, 0.15);
      break;
    }
    case 'core_hit': {
      playNoise(0.08, 0.2, seGain);
      playTone(150, 0.15, 'sawtooth', 0.15, seGain);
      break;
    }
  }
}

function playTone(freq, dur, type, vol, dest, delay) {
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g);
  g.connect(dest || seGain);
  osc.start(t);
  osc.stop(t + dur + 0.01);
}

function playNoise(dur, vol, dest) {
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  src.connect(g);
  g.connect(dest || seGain);
  src.start();
}

function startLoopBgm(melody, bass, vol, type, bpm) {
  let running = true;
  const noteDur = 60 / bpm;
  let nextTime = audioCtx.currentTime + 0.05;

  function scheduleLoop() {
    if (!running) return;
    for (let i = 0; i < melody.length; i++) {
      const t = nextTime + i * noteDur;
      // メロディ
      const osc1 = audioCtx.createOscillator();
      const g1 = audioCtx.createGain();
      osc1.type = type;
      osc1.frequency.value = melody[i];
      g1.gain.setValueAtTime(vol, t);
      g1.gain.setValueAtTime(vol * 0.8, t + noteDur * 0.7);
      g1.gain.exponentialRampToValueAtTime(0.001, t + noteDur * 0.95);
      osc1.connect(g1);
      g1.connect(bgmGain);
      osc1.start(t);
      osc1.stop(t + noteDur);

      // ベース
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.value = bass[i];
      g2.gain.setValueAtTime(vol * 0.6, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + noteDur * 0.9);
      osc2.connect(g2);
      g2.connect(bgmGain);
      osc2.start(t);
      osc2.stop(t + noteDur);
    }
    nextTime += melody.length * noteDur;
    // 次ループのスケジューリング (少し前に予約)
    const delay = (nextTime - audioCtx.currentTime - 0.5) * 1000;
    if (running) setTimeout(scheduleLoop, Math.max(100, delay));
  }

  scheduleLoop();

  return {
    stop() {
      running = false;
    }
  };
}

const SAVE_KEY = 'mamoribito_save';

function saveGame() {
  const data = {
    ver: 2,
    crystals,
    formation,
    weapons,
    enhanceLevels,
    missionClears,
    allyLevels,
    allyXP,
    examPassed,
    jobChanged,
    savedAt: Date.now(),
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch(e) {
    console.error('Save failed:', e);
    return false;
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.ver) return false;

    crystals = data.crystals ?? 50;
    formation = data.formation ?? [0, 1, 2, 3];
    // 武器データの互換性処理: 旧配列形式→新オブジェクト形式に変換
    if (Array.isArray(data.weapons)) {
      weapons = {};
      for (let wi = 0; wi < data.weapons.length; wi++) {
        if (data.weapons[wi]) {
          const oldW = data.weapons[wi];
          // 旧武器typeが新WEAPON_DEFSの範囲内かチェック
          if (oldW.type < WEAPON_DEFS.length) {
            const oldFormation = data.formation || [0, 1, 2, 3];
            const jobIdx = oldFormation[wi] ?? wi;
            weapons[jobIdx] = oldW;
          }
        }
      }
    } else {
      weapons = data.weapons ?? {};
    }
    enhanceLevels = data.enhanceLevels ?? new Array(ALLY_DEFS.length).fill(0);
    missionClears = data.missionClears ?? new Array(MISSION_DEFS.length).fill(false);
    allyLevels = data.allyLevels ?? new Array(ALLY_DEFS.length).fill(1);
    allyXP = data.allyXP ?? new Array(ALLY_DEFS.length).fill(0);
    examPassed = data.examPassed ?? new Array(ADVANCED_DEFS.length).fill(false);
    jobChanged = data.jobChanged ?? new Array(ALLY_DEFS.length).fill(false);

    // 転職済みの職業はALLY_DEFSを上位職データで上書き復元
    for (let i = 0; i < ADVANCED_DEFS.length; i++) {
      const adv = ADVANCED_DEFS[i];
      if (jobChanged[adv.baseJob]) {
        const base = ALLY_DEFS[adv.baseJob];
        base.name = adv.name;
        base.icon = adv.icon;
        base.damage = adv.damage;
        base.range = adv.range;
        base.speed = adv.speed;
        base.maxHp = adv.maxHp;
        base.color = adv.color;
        base.desc = adv.desc;
        if (adv.splash) base.splash = adv.splash;
        if (adv.slow) base.slow = adv.slow;
      }
    }

    updateMenuCrystal();
    return true;
  } catch(e) {
    console.error('Load failed:', e);
    return false;
  }
}

function addXP(jobIdx, amount) {
  if (allyLevels[jobIdx] >= LEVEL_MAX) return;
  const prevLv = allyLevels[jobIdx];
  allyXP[jobIdx] += amount;
  while (allyLevels[jobIdx] < LEVEL_MAX && allyXP[jobIdx] >= getXPForLevel(allyLevels[jobIdx])) {
    allyLevels[jobIdx]++;
  }
  if (allyLevels[jobIdx] > prevLv) playSE('levelup');
}

  gameOver = false;
  victory = false;
  sortieKills = 0;

  // 編成に従って味方4人を配置（強化+武器ボーナス適用）
  for (let i = 0; i < formation.length; i++) {
    const defIdx = formation[i];
    const def = ALLY_DEFS[defIdx];
    const pos = ALLY_POSITIONS[i];
    const enh = getEnhanceBonus(enhanceLevels[defIdx]);
    const lvB = getLevelBonus(allyLevels[defIdx]);
    // 武器ボーナス (職業ごと)
    const w = weapons[defIdx] || null;
    let wAtkMult = 1, wRangePlus = 0, wSpeedMult = 1;
    if (w) {
      const wDef = WEAPON_DEFS[w.type];
      const rB = getRefineBonus(w.refine);
      wAtkMult = wDef.atkMult * rB.atkMult;
      wRangePlus = wDef.rangePlus + rB.rangePlus;
      wSpeedMult = wDef.speedMult * rB.speedMult;
    }
    allies.push({
      type: defIdx,
      name: def.name,
      icon: def.icon,
      x: pos.x,
      y: pos.y,
      damage: def.damage * enh.damageMult * lvB.damageMult * wAtkMult,
      range: def.range + enh.rangePlus + lvB.rangePlus + wRangePlus,
      speed: def.speed * enh.speedMult * lvB.speedMult * wSpeedMult,
      color: def.color,
      splash: def.splash || 0,
      slow: def.slow || 0,
      cooldown: 0,
      angle: Math.PI,
      attackAnim: 0,
    });
  }

  document.getElementById('game-over-overlay').style.display = 'none';
  document.getElementById('victory-overlay').style.display = 'none';
  // HUDに任務名表示
  if (currentMission !== null) {
    const m = MISSION_DEFS[currentMission];
    document.getElementById('hud-mission-name').textContent = m.icon + ' ' + m.name;
  } else {
    document.getElementById('hud-mission-name').textContent = '';
  }

  buildAllyButtons();
  updateHUD();

  // 戦闘オート: 最初のWaveを自動開始
  waveDelay = 1.5;
}

// ===== UIボタン生成 =====
function buildAllyButtons() {
  const container = document.getElementById('ally-buttons');
  container.innerHTML = '';
  allies.forEach((a, i) => {
    const btn = document.createElement('div');
    btn.className = 'ally-btn';
    btn.onclick = () => selectAlly(i);
    const lv = allyLevels[a.type];
    btn.innerHTML = `
      <div class="ally-icon">${a.icon}</div>
      <div class="ally-name">${a.name} <span style="color:#88ccff;font-size:10px;">Lv.${lv}</span></div>
      <div class="ally-desc">${ALLY_DEFS[a.type].desc}</div>
    `;
    container.appendChild(btn);
  });
}

function selectAlly(idx) {
  selectedAlly = allies[idx] || null;
  // ボタンハイライト
  document.querySelectorAll('.ally-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  updateAllyInfo();
}

// ===== HUD更新 =====
function updateHUD() {
  document.getElementById('core-hp').textContent = Math.ceil(core.hp);
  document.getElementById('core-max-hp').textContent = core.maxHp;
  document.getElementById('wave').textContent = wave;
  document.getElementById('max-wave').textContent = missionMaxWave;
  document.getElementById('score').textContent = score;
}

function updateAllyInfo() {
  const panel = document.getElementById('ally-info');
  if (!selectedAlly) {
    panel.style.display = 'none';
    return;
  }
  const a = selectedAlly;
  panel.style.display = 'block';
  const alv = allyLevels[a.type];
  const axp = allyXP[a.type];
  const nextXP = alv < LEVEL_MAX ? getXPForLevel(alv) : axp;
  document.getElementById('info-name').textContent = `${a.icon} ${a.name} Lv.${alv}`;
  document.getElementById('info-damage').textContent = Math.round(a.damage);
  document.getElementById('info-range').textContent = Math.round(a.range) + 'px';
  document.getElementById('info-speed').textContent = a.speed.toFixed(2) + 's';
  document.getElementById('info-xp').textContent = alv >= LEVEL_MAX ? 'MAX' : axp + '/' + nextXP;
}

const SPEED_OPTIONS = [1, 2, 3, 5, 10];
function setSpeed(s) {
  gameSpeed = s;
  document.querySelectorAll('.speed-btn').forEach((btn, i) => {
    btn.classList.toggle('active', SPEED_OPTIONS[i] === s);
  });
}

// キャンバスクリックで味方選択
canvas.addEventListener('click', (e) => {
  if (gameOver || victory) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  // 味方をクリックで選択
  let found = -1;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    const dx = mx - a.x;
    const dy = my - a.y;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      found = i;
      break;
    }
  }
  if (found >= 0) {
    selectAlly(found);
  } else {
    selectedAlly = null;
    document.querySelectorAll('.ally-btn').forEach(btn => btn.classList.remove('selected'));
    updateAllyInfo();
  }
});

// ===== ウェーブ（オート進行） =====
function startNextWave() {
  if (waveActive || gameOver || victory) return;
  wave++;
  waveActive = true;
  spawning = true;
  spawnTimer = 0;
  spawnQueue = generateWave(wave);
  updateHUD();
  document.getElementById('auto-status').textContent = '⚔️ Wave ' + wave + ' 戦闘中...';
  playSE('wave_start');
  // ボスWaveでBGM切替
  if (wave % 5 === 0) playBgm('boss');
  else if (wave % 5 === 1 && wave > 1) playBgm('battle');
}

function generateWave(w) {
  const queue = [];
  const baseCount = 5 + Math.floor(w * 1.5);
  const hpMult = (1 + (w - 1) * 0.35) * missionHpMult;
  const speedMult = (1 + Math.min(w * 0.02, 0.6)) * missionSpeedMult;

  for (let i = 0; i < baseCount; i++) {
    let type = 'normal';
    if (w >= 5 && Math.random() < 0.2 + w * 0.01) type = 'fast';
    if (w >= 10 && Math.random() < 0.1 + w * 0.005) type = 'tank';
    if (w >= 15 && Math.random() < 0.05 + w * 0.003) type = 'healer';

    queue.push(createEnemyDef(type, hpMult, speedMult));
  }

  // ボスウェーブ (5の倍数)
  if (w % 5 === 0) {
    queue.push(createEnemyDef('boss', hpMult * 3, speedMult * 0.6));
  }

  return queue;
}

function createEnemyDef(type, hpMult, speedMult) {
  const defs = {
    normal: { hp: 60, speed: 50, radius: 12, color: '#cc3333', gold: 5, score: 10, name: 'ゴブリン', emoji: '👹' },
    fast:   { hp: 35, speed: 90, radius: 10, color: '#33cc33', gold: 8, score: 15, name: 'コボルト', emoji: '🐺' },
    tank:   { hp: 200, speed: 30, radius: 16, color: '#3366cc', gold: 15, score: 25, name: 'オーガ', emoji: '👻' },
    healer: { hp: 80, speed: 45, radius: 12, color: '#cc33cc', gold: 12, score: 20, name: 'ダークプリースト', emoji: '🧙' },
    boss:   { hp: 500, speed: 25, radius: 22, color: '#ff6600', gold: 50, score: 100, name: 'ドラゴン', emoji: '🐲' },
  };
  const d = defs[type];
  return {
    type,
    hp: Math.floor(d.hp * hpMult),
    maxHp: Math.floor(d.hp * hpMult),
    speed: d.speed * speedMult,
    baseSpeed: d.speed * speedMult,
    radius: d.radius,
    color: d.color,
    gold: d.gold,
    score: d.score,
    name: d.name,
    emoji: d.emoji,
    damage: type === 'boss' ? 3 : (type === 'tank' ? 2 : 1),
    attackSpeed: type === 'fast' ? 0.8 : 1.2,
    attackDamage: type === 'boss' ? 25 : (type === 'tank' ? 15 : 8),
  };
}

function spawnEnemy(def) {
  // 中央付近にランダムにばらけて出現
  const centerY = CORE_Y;
  enemies.push({
    ...def,
    x: SPAWN_X,
    y: centerY + (Math.random() - 0.5) * 80,
    slowTimer: 0,
    _slowAmount: 0,
    alive: true,
    attackCooldown: 0,
    targetAlly: null,
  });
}

// ===== パーティクル =====
function createParticle(x, y, color) {
  const angle = Math.random() * Math.PI * 2;
  const spd = 1 + Math.random() * 3;
  return {
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    life: 0.5 + Math.random() * 0.5,
    maxLife: 0.5 + Math.random() * 0.5,
    color,
    size: 2 + Math.random() * 3,
  };
}

// ===== メインループ =====
let lastTime = 0;
let loopId = 0;

function gameLoop(timestamp) {
  const rawDt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!gameOver && !victory) {
    // 高速時はサブステップで物理精度を維持
    const totalDt = rawDt * gameSpeed;
    const maxStep = 0.1;
    let remaining = totalDt;
    while (remaining > 0) {
      const step = Math.min(remaining, maxStep);
      update(step);
      remaining -= step;
      if (gameOver || victory) break;
    }
  }
  render();
  loopId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // スポーン
  if (spawning && spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(spawnQueue.shift());
      spawnTimer = 0.5;
    }
    if (spawnQueue.length === 0) spawning = false;
  }

  // Wave間のディレイ（オート進行）
  if (waveDelay > 0 && !waveActive && !gameOver && !victory) {
    waveDelay -= dt;
    if (waveDelay <= 0) {
      startNextWave();
    }
  }

  // ウェーブ終了チェック → 次Waveを自動開始
  if (waveActive && !spawning && enemies.length === 0) {
    waveActive = false;
    // ウェーブ間でコアHP少し回復
    core.hp = Math.min(core.maxHp, core.hp + core.maxHp * 0.05);
    updateHUD();

    if (wave >= missionMaxWave) {
      victory = true;
      stopBgm();
      playSE('victory');
      let reward = Math.floor(wave * 3 + score * 0.02);
      // 任務ボーナス報酬
      if (currentMission !== null) {
        const m = MISSION_DEFS[currentMission];
        reward += m.reward;
        if (!missionClears[currentMission]) {
          missionClears[currentMission] = true;
          reward += m.reward; // 初回クリアボーナス
        }
      }
      crystals += reward;
      // クリアXPボーナス
      const clearXP = Math.floor(wave * 5 + score * 0.1);
      const lvBefore = formation.map(f => allyLevels[f]);
      for (let i = 0; i < formation.length; i++) {
        addXP(formation[i], clearXP);
      }
      const lvAfter = formation.map(f => allyLevels[f]);
      document.getElementById('final-score2').textContent = score;
      document.getElementById('victory-reward').textContent = reward;
      showXPResult('victory-xp-result', lvBefore, lvAfter, clearXP);
      document.getElementById('victory-overlay').style.display = 'flex';
    } else {
      // 次Waveまで短い待機
      document.getElementById('auto-status').textContent = '🔄 次のWaveへ...';
      waveDelay = 1.5;
    }
  }

  // 敵移動 & コア攻撃
  for (const e of enemies) {
    if (!e.alive) continue;

    // スロー処理
    let spd = e.baseSpeed;
    if (e.slowTimer > 0) {
      spd *= (1 - (e._slowAmount || 0.3));
      e.slowTimer -= dt;
    }
    e.speed = spd;

    // コアに到達したら攻撃
    if (e.x >= CORE_X - 20) {
      e.x = CORE_X - 20;
      e.attackCooldown -= dt;
      if (e.attackCooldown <= 0) {
        core.hp -= e.attackDamage;
        playSE('core_hit');
        e.attackCooldown = e.attackSpeed;
        for (let i = 0; i < 3; i++) {
          particles.push(createParticle(CORE_X, CORE_Y, '#ff4444'));
        }
        if (core.hp <= 0) {
          core.hp = 0;
          gameOver = true;
          stopBgm();
          playSE('defeat');
          let reward = Math.floor(wave * 2 + score * 0.01);
          // 任務敗北でも難易度に応じた少量報酬
          if (currentMission !== null) {
            reward += Math.floor(MISSION_DEFS[currentMission].reward * 0.3);
          }
          crystals += reward;
          // 敗北時XP（少なめ）
          const defeatXP = Math.floor(wave * 3 + score * 0.05);
          const lvBefore = formation.map(f => allyLevels[f]);
          for (let fi = 0; fi < formation.length; fi++) {
            addXP(formation[fi], defeatXP);
          }
          const lvAfter = formation.map(f => allyLevels[f]);
          document.getElementById('final-wave').textContent = wave;
          document.getElementById('final-score').textContent = score;
          document.getElementById('defeat-reward').textContent = reward;
          showXPResult('defeat-xp-result', lvBefore, lvAfter, defeatXP);
          document.getElementById('game-over-overlay').style.display = 'flex';
        }
        updateHUD();
      }
    } else {
      // 右へ移動
      e.x += spd * dt;
    }

    // ヒーラー: 周囲の敵を回復
    if (e.type === 'healer' && e.alive) {
      for (const other of enemies) {
        if (other === e || !other.alive) continue;
        const hd = Math.sqrt((other.x - e.x) ** 2 + (other.y - e.y) ** 2);
        if (hd < 100) {
          other.hp = Math.min(other.maxHp, other.hp + 15 * dt);
        }
      }
    }
  }

  // 死んだ敵除去
  enemies = enemies.filter(e => e.alive);

  // 味方攻撃
  for (const a of allies) {
    a.cooldown -= dt;
    if (a.attackAnim > 0) a.attackAnim -= dt;
    if (a.cooldown > 0) continue;

    // ターゲット探索（射程内で最も近い敵）
    let target = null;
    let bestDist = Infinity;

    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - a.x;
      const dy = e.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= a.range && dist < bestDist) {
        bestDist = dist;
        target = e;
      }
    }

    if (target) {
      a.cooldown = a.speed;
      a.angle = Math.atan2(target.y - a.y, target.x - a.x);
      a.attackAnim = 0.15;

      projectiles.push({
        x: a.x, y: a.y,
        tx: target.x, ty: target.y,
        target,
        damage: a.damage,
        splash: a.splash || 0,
        slow: a.slow || 0,
        speed: 400,
        color: a.color,
        alive: true,
      });
    }
  }

  // 弾移動
  for (const p of projectiles) {
    if (!p.alive) continue;
    if (p.target && p.target.alive) {
      p.tx = p.target.x;
      p.ty = p.target.y;
    }
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const move = p.speed * dt;

    if (dist <= move) {
      p.alive = false;
      playSE('hit');
      if (p.splash > 0) {
        for (const e of enemies) {
          if (!e.alive) continue;
          const sd = Math.sqrt((e.x - p.tx) ** 2 + (e.y - p.ty) ** 2);
          if (sd <= p.splash) {
            dealDamage(e, p.damage * (1 - sd / p.splash * 0.5));
            if (p.slow > 0) {
              e.slowTimer = 1.5;
              e._slowAmount = p.slow;
            }
          }
        }
        for (let i = 0; i < 8; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      } else {
        if (p.target && p.target.alive) {
          dealDamage(p.target, p.damage);
          if (p.slow > 0) {
            p.target.slowTimer = 1.5;
            p.target._slowAmount = p.slow;
          }
        }
        for (let i = 0; i < 4; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      }
    } else {
      p.x += (dx / dist) * move;
      p.y += (dy / dist) * move;
    }
  }

  projectiles = projectiles.filter(p => p.alive);

  // パーティクル更新
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

let sortieKills = 0; // 出撃中の撃破数

function dealDamage(enemy, dmg) {
  enemy.hp -= dmg;
  if (enemy.hp <= 0 && enemy.alive) {
    enemy.alive = false;
    score += enemy.score;
    sortieKills++;
    playSE(enemy.type === 'boss' ? 'boss_kill' : 'kill');
    updateHUD();
    for (let i = 0; i < 12; i++) {
      particles.push(createParticle(enemy.x, enemy.y, enemy.color));
    }
    // 編成中の全職業にXP付与（撃破XP）
    const xpGain = Math.floor(enemy.score * 0.5 + 2);
    for (let i = 0; i < formation.length; i++) {
      addXP(formation[i], xpGain);
    }
  }
}

function showXPResult(elementId, lvBefore, lvAfter, bonusXP) {
  const el = document.getElementById(elementId);
  let html = '<div style="color:#88ccff;">📊 経験値 +' + bonusXP + ' (ボーナス)</div>';
  html += '<div style="display:flex; gap:12px; justify-content:center; margin-top:6px; flex-wrap:wrap;">';
  for (let i = 0; i < formation.length; i++) {
    const def = ALLY_DEFS[formation[i]];
    const before = lvBefore[i];
    const after = lvAfter[i];
    const leveled = after > before;
    html += '<div style="text-align:center;">' +
      '<div>' + def.icon + ' ' + def.name + '</div>' +
      '<div style="color:' + (leveled ? '#ffdd44' : '#aaa') + ';">Lv.' + before +
      (leveled ? ' → <span style="color:#44ff44;font-weight:bold;">Lv.' + after + ' UP!</span>' : '') +
      '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function getStageTheme() {

    return STAGE_THEMES[currentMission];
  }
  return STAGE_THEMES[0]; // デフォルト: 草原
}

function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  const theme = getStageTheme();

  // 空（グラデーション）
  const skyGrad = ctx.createLinearGradient(0, 0, 0, LANE_TOP);
  skyGrad.addColorStop(0, theme.sky[0]);
  skyGrad.addColorStop(1, theme.sky[1]);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CANVAS_W, LANE_TOP);

  // 太陽/月
  if (theme.sun) {
    const sx = theme.sunX || 650, sy = theme.sunY || 35;
    ctx.beginPath();
    ctx.arc(sx, sy, 25, 0, Math.PI * 2);
    ctx.fillStyle = theme.sunColor || '#FFD700';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, sy, 30, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // 雲
  if (theme.clouds) {
    const cc = theme.cloudColor || 'rgba(255,255,255,0.8)';
    drawCloud(100, 25, 40, cc);
    drawCloud(300, 40, 30, cc);
    drawCloud(500, 20, 35, cc);
  }

  // 地面
  const grassGrad = ctx.createLinearGradient(0, LANE_TOP, 0, CANVAS_H);
  grassGrad.addColorStop(0, theme.ground[0]);
  grassGrad.addColorStop(1, theme.ground[1]);
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, LANE_TOP, CANVAS_W, CANVAS_H - LANE_TOP);

  // 環境光（暗い/幻想的なステージ用）
  if (theme.ambientColor) {
    ctx.fillStyle = theme.ambientColor;
    ctx.fillRect(0, LANE_TOP, CANVAS_W, CANVAS_H - LANE_TOP);
  }

  // 中央の道を描画
  const pathY = CORE_Y - 50;
  const pathH = 100;
  ctx.fillStyle = theme.path;
  ctx.fillRect(0, pathY, CANVAS_W, pathH);
  ctx.strokeStyle = theme.pathEdge;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(0, pathY);
  ctx.lineTo(CANVAS_W, pathY);
  ctx.moveTo(0, pathY + pathH);
  ctx.lineTo(CANVAS_W, pathY + pathH);
  ctx.stroke();
  ctx.setLineDash([]);

  // 道の上下の装飾
  ctx.font = '14px sans-serif';
  for (let gx = 20; gx < CANVAS_W; gx += 70) {
    const gy1 = pathY - 5 + Math.sin(gx * 0.1) * 3;
    const gy2 = pathY + pathH + 5 + Math.sin(gx * 0.1 + 2) * 3;
    ctx.fillText(theme.decoAbove, gx, gy1);
    ctx.fillText(theme.decoBelow, gx, gy2);
  }

  // ステージ固有の追加デコレーション
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (theme.decoExtra) {
    for (const d of theme.decoExtra) {
      ctx.fillText(d.e, d.x, d.y);
    }
  }

  // コア描画
  // コア台座
  ctx.beginPath();
  ctx.arc(CORE_X, CORE_Y, 28, 0, Math.PI * 2);
  const coreGrad = ctx.createRadialGradient(CORE_X, CORE_Y, 5, CORE_X, CORE_Y, 28);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, '#66ddff');
  coreGrad.addColorStop(1, '#2244aa');
  ctx.fillStyle = coreGrad;
  ctx.fill();
  ctx.strokeStyle = '#aaeeff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.lineWidth = 1;
  // コアアイコン
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💎', CORE_X, CORE_Y);
  // コアHPバー
  const coreBarW = 60;
  const coreBarH = 6;
  const coreBarX = CORE_X - coreBarW / 2;
  const coreBarY = CORE_Y + 34;
  ctx.fillStyle = '#333';
  ctx.fillRect(coreBarX, coreBarY, coreBarW, coreBarH);
  const coreRatio = Math.max(0, core.hp / core.maxHp);
  ctx.fillStyle = coreRatio > 0.5 ? '#44ccff' : coreRatio > 0.25 ? '#cccc44' : '#cc4444';
  ctx.fillRect(coreBarX, coreBarY, coreBarW * coreRatio, coreBarH);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(coreBarX, coreBarY, coreBarW, coreBarH);
  // コアラベル
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#aaeeff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('CORE', CORE_X, CORE_Y - 32);

  // 味方射程（選択時）
  if (selectedAlly) {
    const a = selectedAlly;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.range, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
    ctx.fill();
    ctx.lineWidth = 1;
  }

  // 敵描画
  for (const e of enemies) {
    if (!e.alive) continue;

    // 影
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.radius + 2, e.radius * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    drawEnemyCreature(e.x, e.y, e.radius, e.type, e.color);

    // スロー表示
    if (e.slowTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100, 100, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    // HPバー
    const barW = e.radius * 2.5;
    const barH = 4;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 10;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#44cc44' : ratio > 0.25 ? '#cccc44' : '#cc4444';
    ctx.fillRect(barX, barY, barW * ratio, barH);

    // ボスには名前表示
    if (e.type === 'boss') {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ff8800';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(e.name, e.x, e.y - e.radius - 14);
    }
  }

  // 味方描画
  for (const a of allies) {
    // 影
    ctx.beginPath();
    ctx.ellipse(a.x, a.y + 22, 14, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    // 攻撃アニメーション
    let drawX = a.x;
    if (a.attackAnim > 0) {
      drawX -= 6 * (a.attackAnim / 0.15);
    }

    drawAllyCharacter(drawX, a.y, a.type, a.color, a.attackAnim > 0);

    // 選択ハイライト
    if (selectedAlly === a) {
      ctx.beginPath();
      ctx.arc(drawX, a.y, 26, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1;
    }
  }

  // 弾描画
  for (const p of projectiles) {
    if (!p.alive) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 軌跡
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (dx/d)*10, p.y - (dy/d)*10);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  // パーティクル描画
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // ステータスバー（下部）
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, CANVAS_H - 25, CANVAS_W, 25);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const aliveEnemies = enemies.filter(e => e.alive).length;
  ctx.fillText(`コアHP: ${Math.ceil(core.hp)}/${core.maxHp}  |  敵: ${aliveEnemies}体  |  味方: ${allies.length}人`, 10, CANVAS_H - 12);
}

// ===== キャラクター描画関数 =====
function drawAllyCharacter(x, y, jobType, color, attacking) {
  ctx.save();
  ctx.translate(x, y);

  // 基本職マッピング（転職後もbaseJobで描画分岐）
  let baseJob = jobType;
  if (jobChanged[jobType]) {
    // 転職後: ADVANCED_DEFSからbaseJobを使う
    for (const adv of ADVANCED_DEFS) {
      if (adv.baseJob === jobType) { baseJob = jobType; break; }
    }
  }

  const s = 1.0; // スケール
  switch (baseJob) {
    case 0: drawSwordsman(s, color, attacking, jobChanged[0]); break;
    case 1: drawArcher(s, color, attacking, jobChanged[1]); break;
    case 2: drawMage(s, color, attacking, jobChanged[2]); break;
    case 3: drawPaladin(s, color, attacking, jobChanged[3]); break;
    case 4: drawNinja(s, color, attacking, jobChanged[4]); break;
    case 5: drawLancer(s, color, attacking, jobChanged[5]); break;
    case 6: drawSniper(s, color, attacking, jobChanged[6]); break;
    case 7: drawDancer(s, color, attacking, jobChanged[7]); break;
    default: drawGenericHuman(s, color); break;
  }
  ctx.restore();
}

// 汎用人型パーツ
function drawHumanBody(s, skinColor, bodyColor, legColor) {
  // 足
  ctx.fillStyle = legColor || '#554433';
  ctx.fillRect(-6*s, 8*s, 5*s, 12*s);
  ctx.fillRect(1*s, 8*s, 5*s, 12*s);
  // 靴
  ctx.fillStyle = '#443322';
  ctx.fillRect(-7*s, 17*s, 6*s, 4*s);
  ctx.fillRect(1*s, 17*s, 6*s, 4*s);
  // 体
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-8*s, -6*s, 16*s, 16*s);
  // 顔
  ctx.fillStyle = skinColor || '#ffddbb';
  ctx.beginPath();
  ctx.arc(0, -12*s, 8*s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // 目
  ctx.fillStyle = '#222';
  ctx.fillRect(-4*s, -14*s, 2.5*s, 2.5*s);
  ctx.fillRect(1.5*s, -14*s, 2.5*s, 2.5*s);
}

// 0: 剣士 / 剣聖
function drawSwordsman(s, color, atk, advanced) {
  drawHumanBody(s, '#ffddbb', color, '#884433');
  // 鎧ライン
  ctx.strokeStyle = advanced ? '#ffd700' : '#ffeeaa';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-8*s, -2*s); ctx.lineTo(8*s, -2*s); ctx.stroke();
  // 剣
  const sx = atk ? -18*s : -12*s;
  ctx.fillStyle = '#ccc';
  ctx.fillRect(sx, -16*s, 3*s, 20*s);
  ctx.fillStyle = advanced ? '#ffd700' : '#aa8844';
  ctx.fillRect(sx - 2*s, -2*s, 7*s, 3*s); // つば
  // ヘルメット
  ctx.fillStyle = advanced ? '#ffd700' : color;
  ctx.beginPath(); ctx.arc(0, -16*s, 7*s, Math.PI, 0); ctx.fill();
  if (advanced) {
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(-1*s, -24*s, 2*s, 6*s); // 羽飾り
  }
}

// 1: 弓兵 / 弓聖
function drawArcher(s, color, atk, advanced) {
  drawHumanBody(s, '#ffddbb', color, '#556633');
  // マント
  ctx.fillStyle = advanced ? '#22cc66' : '#558844';
  ctx.beginPath();
  ctx.moveTo(6*s, -6*s); ctx.lineTo(12*s, 10*s); ctx.lineTo(4*s, 10*s); ctx.fill();
  // 弓
  ctx.strokeStyle = advanced ? '#ffd700' : '#aa7733';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(-14*s, -4*s, 14*s, -0.7, 0.7);
  ctx.stroke();
  // 弦
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-14*s + 14*s*Math.cos(-0.7), -4*s + 14*s*Math.sin(-0.7));
  ctx.lineTo(atk ? -20*s : -14*s, -4*s);
  ctx.lineTo(-14*s + 14*s*Math.cos(0.7), -4*s + 14*s*Math.sin(0.7));
  ctx.stroke();
  // 帽子
  ctx.fillStyle = advanced ? '#ffd700' : '#558844';
  ctx.beginPath(); ctx.moveTo(-6*s, -18*s); ctx.lineTo(0, -26*s); ctx.lineTo(6*s, -18*s); ctx.fill();
}

// 2: 魔法使い / 大魔導士
function drawMage(s, color, atk, advanced) {
  // ローブ（体が隠れる）
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-10*s, -6*s);
  ctx.lineTo(-12*s, 20*s);
  ctx.lineTo(12*s, 20*s);
  ctx.lineTo(10*s, -6*s);
  ctx.fill();
  // 顔
  ctx.fillStyle = '#ffddbb';
  ctx.beginPath(); ctx.arc(0, -12*s, 8*s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.fillRect(-4*s, -14*s, 2.5*s, 2.5*s);
  ctx.fillRect(1.5*s, -14*s, 2.5*s, 2.5*s);
  // 三角帽子
  ctx.fillStyle = advanced ? '#ffd700' : color;
  ctx.beginPath(); ctx.moveTo(-10*s, -16*s); ctx.lineTo(0, -32*s); ctx.lineTo(10*s, -16*s); ctx.fill();
  ctx.fillStyle = advanced ? '#ff44ff' : '#ffcc44';
  ctx.beginPath(); ctx.arc(0, -32*s, 3*s, 0, Math.PI * 2); ctx.fill(); // 帽子先端の星
  // 杖
  const sx = atk ? -18*s : -14*s;
  ctx.fillStyle = '#886644';
  ctx.fillRect(sx, -24*s, 3*s, 36*s);
  ctx.fillStyle = advanced ? '#ff44ff' : '#44aaff';
  ctx.beginPath(); ctx.arc(sx + 1.5*s, -26*s, 5*s, 0, Math.PI * 2); ctx.fill();
  if (atk) {
    ctx.fillStyle = advanced ? 'rgba(255,68,255,0.4)' : 'rgba(68,170,255,0.4)';
    ctx.beginPath(); ctx.arc(sx + 1.5*s, -26*s, 10*s, 0, Math.PI * 2); ctx.fill();
  }
}

// 3: 聖騎士 / 聖王
function drawPaladin(s, color, atk, advanced) {
  drawHumanBody(s, '#ffddbb', color, '#887733');
  // 重装鎧ライン
  ctx.strokeStyle = advanced ? '#ffd700' : '#ddd';
  ctx.lineWidth = 2;
  ctx.strokeRect(-8*s, -6*s, 16*s, 16*s);
  // 盾
  ctx.fillStyle = advanced ? '#ffd700' : '#4488cc';
  ctx.beginPath();
  ctx.moveTo(12*s, -8*s); ctx.lineTo(22*s, -4*s); ctx.lineTo(22*s, 8*s);
  ctx.lineTo(12*s, 12*s); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.stroke();
  if (advanced) {
    ctx.fillStyle = '#fff';
    ctx.font = '8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✦', 17*s, 2*s);
  }
  // 剣
  const sx = atk ? -16*s : -10*s;
  ctx.fillStyle = '#ddd';
  ctx.fillRect(sx, -14*s, 3*s, 18*s);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(sx - 2*s, 0, 7*s, 3*s);
  // ヘルメット
  ctx.fillStyle = advanced ? '#ffd700' : '#aaa';
  ctx.beginPath(); ctx.arc(0, -16*s, 8*s, Math.PI, 0); ctx.fill();
  if (advanced) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.moveTo(-2*s, -24*s); ctx.lineTo(0, -30*s); ctx.lineTo(2*s, -24*s); ctx.fill();
  }
}

// 4: 忍者 / 影忍
function drawNinja(s, color, atk, advanced) {
  // 体
  ctx.fillStyle = advanced ? '#220044' : '#333';
  ctx.fillRect(-7*s, -6*s, 14*s, 14*s);
  // 足
  ctx.fillStyle = '#222';
  ctx.fillRect(-5*s, 8*s, 4*s, 10*s);
  ctx.fillRect(1*s, 8*s, 4*s, 10*s);
  // マスクの顔
  ctx.fillStyle = advanced ? '#220044' : '#333';
  ctx.beginPath(); ctx.arc(0, -12*s, 8*s, 0, Math.PI * 2); ctx.fill();
  // 目だけ光る
  ctx.fillStyle = advanced ? '#ff44ff' : '#ff4444';
  ctx.fillRect(-5*s, -14*s, 3*s, 2*s);
  ctx.fillRect(2*s, -14*s, 3*s, 2*s);
  // マフラー
  ctx.fillStyle = advanced ? '#aa00aa' : color;
  ctx.beginPath();
  ctx.moveTo(6*s, -12*s); ctx.lineTo(18*s, -6*s); ctx.lineTo(16*s, 2*s); ctx.lineTo(6*s, -4*s);
  ctx.fill();
  // 苦無
  const sx = atk ? -18*s : -12*s;
  ctx.fillStyle = '#bbb';
  ctx.beginPath();
  ctx.moveTo(sx, -12*s); ctx.lineTo(sx - 6*s, -6*s); ctx.lineTo(sx, 0);
  ctx.lineTo(sx + 2*s, -6*s); ctx.fill();
}

// 5: 槍兵 / 竜騎士
function drawLancer(s, color, atk, advanced) {
  drawHumanBody(s, '#ffddbb', color, '#775533');
  // 鎧ライン
  ctx.strokeStyle = advanced ? '#ff8800' : '#ddd';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-8*s, 0); ctx.lineTo(8*s, 0); ctx.stroke();
  // 槍
  const sx = atk ? -22*s : -14*s;
  ctx.fillStyle = '#886644';
  ctx.fillRect(sx + 6*s, -4*s, 3*s, 28*s);
  ctx.fillStyle = advanced ? '#ff8800' : '#ccc';
  ctx.beginPath();
  ctx.moveTo(sx + 4*s, -4*s); ctx.lineTo(sx + 7.5*s, -16*s); ctx.lineTo(sx + 11*s, -4*s);
  ctx.fill();
  // ヘルメット
  ctx.fillStyle = advanced ? '#ff8800' : color;
  ctx.beginPath(); ctx.arc(0, -16*s, 7*s, Math.PI, 0); ctx.fill();
  if (advanced) {
    // 竜の翼
    ctx.fillStyle = 'rgba(255,136,0,0.6)';
    ctx.beginPath();
    ctx.moveTo(8*s, -4*s); ctx.lineTo(24*s, -16*s); ctx.lineTo(20*s, 4*s); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8*s, -4*s); ctx.lineTo(-24*s, -16*s); ctx.lineTo(-20*s, 4*s); ctx.fill();
  }
}

// 6: 狙撃手 / 魔弾の射手
function drawSniper(s, color, atk, advanced) {
  drawHumanBody(s, '#ffddbb', color, '#445566');
  // コート
  ctx.fillStyle = advanced ? '#115555' : '#556677';
  ctx.beginPath();
  ctx.moveTo(6*s, -2*s); ctx.lineTo(10*s, 16*s); ctx.lineTo(4*s, 16*s); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-6*s, -2*s); ctx.lineTo(-10*s, 16*s); ctx.lineTo(-4*s, 16*s); ctx.fill();
  // 銃/クロスボウ
  const sx = atk ? -20*s : -14*s;
  ctx.fillStyle = '#666';
  ctx.fillRect(sx, -6*s, 18*s, 3*s);
  ctx.fillStyle = '#444';
  ctx.fillRect(sx, -10*s, 3*s, 8*s);
  if (advanced) {
    ctx.fillStyle = '#44ffff';
    ctx.beginPath(); ctx.arc(sx + 1.5*s, -4.5*s, 4*s, 0, Math.PI * 2); ctx.globalAlpha = 0.4; ctx.fill();
    ctx.globalAlpha = 1;
  }
  // フード
  ctx.fillStyle = advanced ? '#115555' : '#556677';
  ctx.beginPath(); ctx.arc(0, -14*s, 9*s, Math.PI * 0.8, Math.PI * 0.2); ctx.fill();
  // スコープ光
  if (advanced) {
    ctx.fillStyle = '#44ffff';
    ctx.beginPath(); ctx.arc(sx, -6*s, 2*s, 0, Math.PI * 2); ctx.fill();
  }
}

// 7: 踊り子 / 神楽巫女
function drawDancer(s, color, atk, advanced) {
  // スカート（広がるドレス）
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-6*s, -2*s);
  ctx.lineTo(-14*s, 20*s);
  ctx.lineTo(14*s, 20*s);
  ctx.lineTo(6*s, -2*s);
  ctx.fill();
  // 上半身
  ctx.fillStyle = advanced ? '#ffaacc' : color;
  ctx.fillRect(-6*s, -8*s, 12*s, 8*s);
  // 顔
  ctx.fillStyle = '#ffddbb';
  ctx.beginPath(); ctx.arc(0, -14*s, 7*s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.fillRect(-3*s, -16*s, 2*s, 2*s);
  ctx.fillRect(1*s, -16*s, 2*s, 2*s);
  // 髪
  ctx.fillStyle = advanced ? '#ffaacc' : '#885522';
  ctx.beginPath(); ctx.arc(0, -16*s, 8*s, Math.PI * 0.9, Math.PI * 0.1); ctx.fill();
  ctx.fillRect(-8*s, -16*s, 3*s, 12*s);
  ctx.fillRect(5*s, -16*s, 3*s, 12*s);
  // 扇/鈴
  if (advanced) {
    ctx.fillStyle = '#ff66aa';
    ctx.beginPath(); ctx.arc(-14*s, -6*s, 6*s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(-14*s, -6*s, 3*s, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#ff88aa';
    ctx.beginPath();
    ctx.moveTo(-12*s, -10*s); ctx.lineTo(-22*s, -16*s); ctx.lineTo(-22*s, 0); ctx.fill();
  }
  // リボン
  ctx.fillStyle = advanced ? '#ffd700' : '#ff4488';
  ctx.fillRect(-2*s, -8*s, 4*s, 2*s);
}

// 汎用人型
function drawGenericHuman(s, color) {
  drawHumanBody(s, '#ffddbb', color, '#555');
}

// ===== 敵モンスター描画 =====
function drawEnemyCreature(x, y, r, type, color) {
  ctx.save();
  ctx.translate(x, y);

  switch (type) {
    case 'normal': drawSlime(r, color); break;
    case 'fast': drawWolf(r, color); break;
    case 'tank': drawGolem(r, color); break;
    case 'healer': drawDarkPriest(r, color); break;
    case 'boss': drawDragon(r, color); break;
    default: drawSlime(r, color); break;
  }
  ctx.restore();
}

// スライム (normal)
function drawSlime(r, color) {
  // ぷるんとしたスライム体
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r, r * 0.3);
  ctx.quadraticCurveTo(-r, -r, 0, -r);
  ctx.quadraticCurveTo(r, -r, r, r * 0.3);
  ctx.quadraticCurveTo(r * 0.5, r * 0.6, 0, r * 0.5);
  ctx.quadraticCurveTo(-r * 0.5, r * 0.6, -r, r * 0.3);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.25, 0, Math.PI * 2); ctx.fill();
  // 目
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.1, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.1, r * 0.1, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, r * 0.1, r * 0.2, 0, Math.PI); ctx.stroke();
}

// 狼 (fast)
function drawWolf(r, color) {
  const s = r / 10;
  // 体
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 2*s, r, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8; ctx.stroke();
  // 頭
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.2, r * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.stroke();
  // 耳
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r * 0.9, -r * 0.5); ctx.lineTo(-r * 1.1, -r * 1.0); ctx.lineTo(-r * 0.7, -r * 0.6);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.5); ctx.lineTo(-r * 0.6, -r * 1.0); ctx.lineTo(-r * 0.3, -r * 0.5);
  ctx.fill();
  // 目
  ctx.fillStyle = '#ff4444';
  ctx.beginPath(); ctx.arc(-r * 0.8, -r * 0.25, 2*s, 0, Math.PI * 2); ctx.fill();
  // 鼻
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-r * 1.1, -r * 0.15, 1.5*s, 0, Math.PI * 2); ctx.fill();
  // 足
  ctx.fillStyle = color;
  ctx.fillRect(-r * 0.6, r * 0.3, 3*s, 6*s);
  ctx.fillRect(-r * 0.2, r * 0.3, 3*s, 6*s);
  ctx.fillRect(r * 0.2, r * 0.3, 3*s, 6*s);
  ctx.fillRect(r * 0.6, r * 0.3, 3*s, 6*s);
  // しっぽ
  ctx.strokeStyle = color; ctx.lineWidth = 2*s;
  ctx.beginPath();
  ctx.moveTo(r * 0.8, 0); ctx.quadraticCurveTo(r * 1.3, -r * 0.5, r * 1.1, -r * 0.7);
  ctx.stroke();
}

// ゴーレム (tank)
function drawGolem(r, color) {
  const s = r / 16;
  // 体（四角い岩）
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r * 0.7, -r * 0.5);
  ctx.lineTo(-r * 0.8, r * 0.6);
  ctx.lineTo(r * 0.8, r * 0.6);
  ctx.lineTo(r * 0.7, -r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
  // 岩テクスチャ
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-r*0.4, -r*0.3); ctx.lineTo(-r*0.2, r*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.2, -r*0.2); ctx.lineTo(r*0.4, r*0.4); ctx.stroke();
  // 頭
  ctx.fillStyle = color;
  ctx.fillRect(-r * 0.5, -r * 0.9, r, r * 0.5);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
  ctx.strokeRect(-r * 0.5, -r * 0.9, r, r * 0.5);
  // 目（光る）
  ctx.fillStyle = '#ffaa00';
  ctx.fillRect(-r * 0.3, -r * 0.75, r * 0.2, r * 0.15);
  ctx.fillRect(r * 0.1, -r * 0.75, r * 0.2, r * 0.15);
  // 腕
  ctx.fillStyle = color;
  ctx.fillRect(-r * 1.1, -r * 0.3, r * 0.4, r * 0.7);
  ctx.fillRect(r * 0.7, -r * 0.3, r * 0.4, r * 0.7);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
  ctx.strokeRect(-r * 1.1, -r * 0.3, r * 0.4, r * 0.7);
  ctx.strokeRect(r * 0.7, -r * 0.3, r * 0.4, r * 0.7);
}

// ダークプリースト (healer)
function drawDarkPriest(r, color) {
  // ローブ
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r * 0.6, -r * 0.3);
  ctx.lineTo(-r * 0.8, r * 0.8);
  ctx.lineTo(r * 0.8, r * 0.8);
  ctx.lineTo(r * 0.6, -r * 0.3);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  // フード
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 0.6, Math.PI, 0); ctx.fill();
  ctx.fillRect(-r * 0.6, -r * 0.4, r * 1.2, r * 0.2);
  // 目（紫に光る）
  ctx.fillStyle = '#ee44ee';
  ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.2, -r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
  // 杖
  ctx.fillStyle = '#554433';
  ctx.fillRect(-r * 0.9, -r * 0.8, r * 0.15, r * 1.5);
  ctx.fillStyle = '#ee44ee';
  ctx.beginPath(); ctx.arc(-r * 0.83, -r * 0.9, r * 0.18, 0, Math.PI * 2); ctx.fill();
  // 回復オーラ
  ctx.strokeStyle = 'rgba(238,68,238,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2); ctx.stroke();
}

// ドラゴン (boss)
function drawDragon(r, color) {
  const s = r / 22;
  // 体
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 2*s, r * 0.8, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  // 腹
  ctx.fillStyle = '#ffcc66';
  ctx.beginPath();
  ctx.ellipse(0, 4*s, r * 0.5, r * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  // 頭
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-r * 0.6, -r * 0.4, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  // 角
  ctx.fillStyle = '#dda000';
  ctx.beginPath();
  ctx.moveTo(-r * 0.7, -r * 0.7); ctx.lineTo(-r * 0.9, -r * 1.2); ctx.lineTo(-r * 0.5, -r * 0.6); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 0.4, -r * 0.7); ctx.lineTo(-r * 0.3, -r * 1.1); ctx.lineTo(-r * 0.2, -r * 0.6); ctx.fill();
  // 目
  ctx.fillStyle = '#ff2200';
  ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.35, r * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.35, r * 0.06, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.fillStyle = '#880000';
  ctx.beginPath();
  ctx.moveTo(-r * 0.9, -r * 0.2); ctx.lineTo(-r * 1.1, -r * 0.15); ctx.lineTo(-r * 0.9, -r * 0.05);
  ctx.fill();
  // 翼
  ctx.fillStyle = 'rgba(255,100,0,0.6)';
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.3); ctx.lineTo(r * 0.5, -r * 1.2); ctx.lineTo(r * 0.9, -r * 0.8);
  ctx.lineTo(r * 0.6, -r * 0.2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
  // しっぽ
  ctx.strokeStyle = color; ctx.lineWidth = 4*s;
  ctx.beginPath();
  ctx.moveTo(r * 0.7, 2*s);
  ctx.quadraticCurveTo(r * 1.2, -r * 0.2, r * 1.0, -r * 0.5);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.55); ctx.lineTo(r * 1.2, -r * 0.7); ctx.lineTo(r * 1.05, -r * 0.35);
  ctx.fill();
  // 足
  ctx.fillStyle = color;
  ctx.fillRect(-r * 0.4, r * 0.35, 5*s, 8*s);
  ctx.fillRect(r * 0.1, r * 0.35, 5*s, 8*s);
}

function drawCloud(x, y, size, color) {
  ctx.fillStyle = color || 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

function closeFormation() {

  setTimeout(fitToScreen, 0);
}

function renderFormation() {
  const grid = document.getElementById('formation-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const def = ALLY_DEFS[formation[i]];
    const slot = document.createElement('div');

      '<div class="slot-icon">' + def.icon + '</div>' +
      '<div class="slot-name">' + def.name + ' <span style="color:#88ccff;font-size:12px;">Lv.' + lv + '</span></div>' +
      '<div class="slot-desc">' + def.desc + '</div>';

}

function selectSlot(idx) {
  editingSlot = (editingSlot === idx) ? -1 : idx;
  renderFormation();
}

function renderJobPicker() {
  const picker = document.getElementById('job-picker');
  if (editingSlot < 0) {
    picker.style.display = 'none';
    return;
  }
  picker.style.display = 'flex';
  picker.innerHTML = '';
  for (let j = 0; j < ALLY_DEFS.length; j++) {
    const def = ALLY_DEFS[j];

      '<div class="pick-name">' + def.name + '</div>' +

}

function pickJob(jobIdx) {
  if (editingSlot < 0) return;
  formation[editingSlot] = jobIdx;
  editingSlot = -1;
  renderFormation();
}

  autoSave();
  setTimeout(fitToScreen, 0);

function updateMenuCrystal() {
  document.getElementById('menu-crystal-count').textContent = crystals;
}

function renderEnhance() {
  document.getElementById('enhance-crystal-count').textContent = crystals;
  const grid = document.getElementById('enhance-grid');
  grid.innerHTML = '';
  for (let j = 0; j < ALLY_DEFS.length; j++) {
    const def = ALLY_DEFS[j];
    const lv = enhanceLevels[j];
    const card = document.createElement('div');
    card.className = 'enhance-card' + (enhanceSelected === j ? ' selected' : '');
    card.onclick = () => { enhanceSelected = (enhanceSelected === j) ? -1 : j; renderEnhance(); };
    let pips = '';
    for (let p = 0; p < ENHANCE_MAX; p++) {
      pips += '<div class="enh-pip' + (p < lv ? ' filled' : '') + '"></div>';
    }
    card.innerHTML =
      '<div class="enh-icon">' + def.icon + '</div>' +
      '<div class="enh-name">' + def.name + '</div>' +
