<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伝説のまもりびと - 横スクロールタワーディフェンス</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a2a1a;
  color: #e0ffe0;
  font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  user-select: none;
}

#game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 960px;
  padding: 8px 16px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border-bottom: 2px solid #4a8a2a;
}

#game-header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hud-info {
  display: flex;
  gap: 20px;
  font-size: 14px;
}

.hud-info span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.gold-icon { color: #ffd700; }
.life-icon { color: #ff4444; }
.wave-icon { color: #44aaff; }

#game-container {
  position: relative;
  display: flex;
  gap: 0;
}

canvas {
  display: block;
  cursor: pointer;
  border: 2px solid #4a8a2a;
  border-right: none;
}

#side-panel {
  width: 200px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border: 2px solid #4a8a2a;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 600px;
  overflow-y: auto;
}

#side-panel h3 {
  font-size: 14px;
  text-align: center;
  color: #ffd700;
  border-bottom: 1px solid #4a8a2a;
  padding-bottom: 6px;
}

.ally-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  color: #e0ffe0;
}

.ally-btn:hover {
  background: rgba(74, 138, 42, 0.6);
  transform: scale(1.02);
}

.ally-btn.selected {
  background: rgba(255, 215, 0, 0.2);
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.ally-btn .ally-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.ally-btn .ally-name {
  font-size: 12px;
  font-weight: bold;
}

.ally-btn .ally-desc {
  font-size: 10px;
  color: #a0c090;
  text-align: center;
  margin-top: 2px;
}

#ally-info {
  background: rgba(0,0,0,0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  padding: 8px;
  font-size: 11px;
  display: none;
}

#ally-info h4 {
  color: #ffd700;
  margin-bottom: 4px;
}

#ally-info .stat {
  display: flex;
  justify-content: space-between;
  margin: 2px 0;
}

#upgrade-btn {
  padding: 6px;
  border: 1px solid;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  margin-top: 4px;
  background: rgba(0, 150, 0, 0.3);
  border-color: #00aa00;
  color: #88ff88;
  width: 100%;
}

#upgrade-btn:hover { background: rgba(0, 150, 0, 0.5); }
#upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; }

#wave-btn {
  padding: 10px;
  background: linear-gradient(180deg, #aa4400, #883300);
  border: 2px solid #ff8800;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  margin-top: auto;
  transition: all 0.2s;
}

#wave-btn:hover {
  background: linear-gradient(180deg, #cc5500, #aa4400);
  box-shadow: 0 0 15px rgba(255, 136, 0, 0.4);
}

#wave-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.speed-btn {
  padding: 4px 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 4px;
  color: #e0ffe0;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}

.speed-btn.active {
  background: rgba(255, 215, 0, 0.3);
  border-color: #ffd700;
}

#game-over-overlay, #victory-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 760px; height: 600px;
  background: rgba(0, 0, 0, 0.85);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#game-over-overlay h2 {
  font-size: 48px;
  color: #ff4444;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff0000;
}

#victory-overlay h2 {
  font-size: 48px;
  color: #ffd700;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ffaa00;
}

#game-over-overlay p, #victory-overlay p {
  font-size: 18px;
  margin-bottom: 30px;
}

#restart-btn, #restart-btn2 {
  padding: 12px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#restart-btn:hover, #restart-btn2:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}
</style>
</head>
<body>

<div id="game-header">
  <h1>伝説のまもりびと</h1>
  <div class="hud-info">
    <span><span class="gold-icon">&#x2B50;</span> <span id="gold">100</span>G</span>
    <span><span class="life-icon">&#x2764;</span> <span id="lives">20</span></span>
    <span><span class="wave-icon">&#x2694;</span> Wave <span id="wave">0</span>/<span id="max-wave">30</span></span>
    <span>Score: <span id="score">0</span></span>
    <span>
      <button class="speed-btn active" onclick="setSpeed(1)">x1</button>
      <button class="speed-btn" onclick="setSpeed(2)">x2</button>
    </span>
  </div>
</div>

<div id="game-container">
  <canvas id="gameCanvas" width="760" height="600"></canvas>
  <div id="side-panel">
    <h3>味方ユニット</h3>
    <div id="ally-buttons"></div>

    <div id="ally-info">
      <h4 id="info-name"></h4>
      <div class="stat"><span>レベル</span><span id="info-level"></span></div>
      <div class="stat"><span>攻撃力</span><span id="info-damage"></span></div>
      <div class="stat"><span>射程</span><span id="info-range"></span></div>
      <div class="stat"><span>速度</span><span id="info-speed"></span></div>
      <div class="stat"><span>HP</span><span id="info-hp"></span></div>
      <button id="upgrade-btn" onclick="upgradeAlly()">強化 (<span id="upgrade-cost"></span>G)</button>
    </div>

    <button id="wave-btn" onclick="startWave()">次のWaveへ ⚔️</button>
  </div>

  <div id="game-over-overlay">
    <h2>敗北...</h2>
    <p>Wave <span id="final-wave">0</span> まで到達</p>
    <p>スコア: <span id="final-score">0</span></p>
    <button id="restart-btn" onclick="restartGame()">もう一度挑戦</button>
  </div>

  <div id="victory-overlay">
    <h2>勝利！</h2>
    <p>全Waveを制覇！</p>
    <p>スコア: <span id="final-score2">0</span></p>
    <button id="restart-btn2" onclick="restartGame()">もう一度挑戦</button>
  </div>
</div>

<script>
// ===== ゲーム定数 =====
const CANVAS_W = 760;
const CANVAS_H = 600;
const LANE_COUNT = 4;
const LANE_H = 100;
const LANE_TOP = 80;  // レーンの開始Y位置
const GOAL_X = 700;   // 味方の防衛ライン（右側）
const SPAWN_X = -30;  // 敵のスポーン位置（左端の外）
const MAX_WAVE = 30;

// 味方ユニット定義
const ALLY_DEFS = [
  { name: '剣士', icon: '⚔️', damage: 20, range: 80, speed: 0.8, maxHp: 150, color: '#cc4444',
    desc: '近距離の高火力アタッカー' },
  { name: '弓兵', icon: '🏹', damage: 12, range: 200, speed: 1.0, maxHp: 80, color: '#44cc44',
    desc: '遠距離の安定した攻撃' },
  { name: '魔法使い', icon: '🔮', damage: 18, range: 180, speed: 1.5, maxHp: 70, color: '#8844ff',
    desc: '範囲攻撃＋スロー効果', splash: 60, slow: 0.3 },
  { name: '聖騎士', icon: '🛡️', damage: 15, range: 100, speed: 1.0, maxHp: 250, color: '#ffcc00',
    desc: '高耐久の守護者' },
];

// ===== ゲーム状態 =====
let gold, lives, wave, score, gameSpeed;
let allies, enemies, projectiles, particles;
let selectedAlly;
let waveActive, spawning, spawnTimer, spawnQueue;
let gameOver, victory;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function init() {
  gold = 100;
  lives = 20;
  wave = 0;
  score = 0;
  gameSpeed = 1;
  allies = [];
  enemies = [];
  projectiles = [];
  particles = [];
  selectedAlly = null;
  waveActive = false;
  spawning = false;
  spawnTimer = 0;
  spawnQueue = [];
  gameOver = false;
  victory = false;

  // 初期味方4人を配置（各レーンに1人）
  for (let i = 0; i < LANE_COUNT; i++) {
    const def = ALLY_DEFS[i];
    const laneY = LANE_TOP + i * LANE_H + LANE_H / 2;
    allies.push({
      type: i,
      name: def.name,
      icon: def.icon,
      x: GOAL_X,
      y: laneY,
      lane: i,
      level: 1,
      damage: def.damage,
      range: def.range,
      speed: def.speed,
      maxHp: def.maxHp,
      hp: def.maxHp,
      color: def.color,
      splash: def.splash || 0,
      slow: def.slow || 0,
      cooldown: 0,
      totalSpent: 0,
      angle: Math.PI, // 左を向く
      attackAnim: 0,
    });
  }

  document.getElementById('game-over-overlay').style.display = 'none';
  document.getElementById('victory-overlay').style.display = 'none';
  document.getElementById('wave-btn').disabled = false;
  buildAllyButtons();
  updateHUD();
}

// ===== UIボタン生成 =====
function buildAllyButtons() {
  const container = document.getElementById('ally-buttons');
  container.innerHTML = '';
  allies.forEach((a, i) => {
    const btn = document.createElement('div');
    btn.className = 'ally-btn';
    btn.onclick = () => selectAlly(i);
    btn.innerHTML = `
      <div class="ally-icon">${a.icon}</div>
      <div class="ally-name">${a.name}</div>
      <div class="ally-desc">${ALLY_DEFS[a.type].desc}</div>
    `;
    container.appendChild(btn);
  });
}

function selectAlly(idx) {
  selectedAlly = allies[idx] || null;
  // ボタンハイライト
  document.querySelectorAll('.ally-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  updateAllyInfo();
}

// ===== HUD更新 =====
function updateHUD() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = wave;
  document.getElementById('max-wave').textContent = MAX_WAVE;
  document.getElementById('score').textContent = score;
}

function updateAllyInfo() {
  const panel = document.getElementById('ally-info');
  if (!selectedAlly) {
    panel.style.display = 'none';
    return;
  }
  const a = selectedAlly;
  panel.style.display = 'block';
  document.getElementById('info-name').textContent = `${a.icon} ${a.name}`;
  document.getElementById('info-level').textContent = a.level;
  document.getElementById('info-damage').textContent = Math.round(a.damage);
  document.getElementById('info-range').textContent = Math.round(a.range) + 'px';
  document.getElementById('info-speed').textContent = a.speed.toFixed(2) + 's';
  document.getElementById('info-hp').textContent = `${Math.round(a.hp)} / ${a.maxHp}`;

  const cost = getUpgradeCost(a);
  document.getElementById('upgrade-cost').textContent = cost;
  const btn = document.getElementById('upgrade-btn');
  btn.style.display = a.level >= 10 ? 'none' : 'block';
  btn.disabled = gold < cost;
}

function getUpgradeCost(a) {
  return Math.floor(30 + a.level * 20);
}

function upgradeAlly() {
  if (!selectedAlly || selectedAlly.level >= 10) return;
  const cost = getUpgradeCost(selectedAlly);
  if (gold < cost) return;
  gold -= cost;
  const a = selectedAlly;
  a.level++;
  a.damage *= 1.25;
  a.range += 10;
  a.speed *= 0.95;
  a.maxHp += 20;
  a.hp = Math.min(a.hp + 20, a.maxHp);
  if (a.splash > 0) a.splash += 5;
  if (a.slow > 0) a.slow = Math.min(a.slow + 0.03, 0.6);
  a.totalSpent += cost;
  updateHUD();
  updateAllyInfo();
  for (let i = 0; i < 8; i++) {
    particles.push(createParticle(a.x, a.y, '#ffd700'));
  }
}

function setSpeed(s) {
  gameSpeed = s;
  document.querySelectorAll('.speed-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i + 1) === s);
  });
}

// キャンバスクリックで味方選択
canvas.addEventListener('click', (e) => {
  if (gameOver || victory) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // 味方をクリックで選択
  let found = -1;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    const dx = mx - a.x;
    const dy = my - a.y;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      found = i;
      break;
    }
  }
  if (found >= 0) {
    selectAlly(found);
  } else {
    selectedAlly = null;
    document.querySelectorAll('.ally-btn').forEach(btn => btn.classList.remove('selected'));
    updateAllyInfo();
  }
});

// ===== ウェーブ =====
function startWave() {
  if (waveActive || gameOver || victory) return;
  wave++;
  waveActive = true;
  spawning = true;
  spawnTimer = 0;
  document.getElementById('wave-btn').disabled = true;
  spawnQueue = generateWave(wave);
  updateHUD();
}

function generateWave(w) {
  const queue = [];
  const baseCount = 5 + Math.floor(w * 1.5);
  const hpMult = 1 + (w - 1) * 0.35;
  const speedMult = 1 + Math.min(w * 0.02, 0.6);

  for (let i = 0; i < baseCount; i++) {
    let type = 'normal';
    if (w >= 5 && Math.random() < 0.2 + w * 0.01) type = 'fast';
    if (w >= 10 && Math.random() < 0.1 + w * 0.005) type = 'tank';
    if (w >= 15 && Math.random() < 0.05 + w * 0.003) type = 'healer';

    const lane = Math.floor(Math.random() * LANE_COUNT);
    queue.push(createEnemyDef(type, hpMult, speedMult, lane));
  }

  // ボスウェーブ (5の倍数)
  if (w % 5 === 0) {
    const lane = Math.floor(Math.random() * LANE_COUNT);
    queue.push(createEnemyDef('boss', hpMult * 3, speedMult * 0.6, lane));
  }

  return queue;
}

function createEnemyDef(type, hpMult, speedMult, lane) {
  const defs = {
    normal: { hp: 60, speed: 50, radius: 12, color: '#cc3333', gold: 5, score: 10, name: 'ゴブリン', emoji: '👹' },
    fast:   { hp: 35, speed: 90, radius: 10, color: '#33cc33', gold: 8, score: 15, name: 'コボルト', emoji: '🐺' },
    tank:   { hp: 200, speed: 30, radius: 16, color: '#3366cc', gold: 15, score: 25, name: 'オーガ', emoji: '👻' },
    healer: { hp: 80, speed: 45, radius: 12, color: '#cc33cc', gold: 12, score: 20, name: 'ダークプリースト', emoji: '🧙' },
    boss:   { hp: 500, speed: 25, radius: 22, color: '#ff6600', gold: 50, score: 100, name: 'ドラゴン', emoji: '🐲' },
  };
  const d = defs[type];
  return {
    type, lane,
    hp: Math.floor(d.hp * hpMult),
    maxHp: Math.floor(d.hp * hpMult),
    speed: d.speed * speedMult,
    baseSpeed: d.speed * speedMult,
    radius: d.radius,
    color: d.color,
    gold: d.gold,
    score: d.score,
    name: d.name,
    emoji: d.emoji,
    damage: type === 'boss' ? 3 : (type === 'tank' ? 2 : 1),
    attackSpeed: type === 'fast' ? 0.8 : 1.2,
    attackDamage: type === 'boss' ? 25 : (type === 'tank' ? 15 : 8),
  };
}

function spawnEnemy(def) {
  const laneY = LANE_TOP + def.lane * LANE_H + LANE_H / 2;
  enemies.push({
    ...def,
    x: SPAWN_X,
    y: laneY + (Math.random() - 0.5) * 20,
    slowTimer: 0,
    _slowAmount: 0,
    alive: true,
    attackCooldown: 0,
    targetAlly: null,
  });
}

// ===== パーティクル =====
function createParticle(x, y, color) {
  const angle = Math.random() * Math.PI * 2;
  const spd = 1 + Math.random() * 3;
  return {
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    life: 0.5 + Math.random() * 0.5,
    maxLife: 0.5 + Math.random() * 0.5,
    color,
    size: 2 + Math.random() * 3,
  };
}

// ===== メインループ =====
let lastTime = 0;

function gameLoop(timestamp) {
  const rawDt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const dt = rawDt * gameSpeed;

  if (!gameOver && !victory) {
    update(dt);
  }
  render();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // スポーン
  if (spawning && spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(spawnQueue.shift());
      spawnTimer = 0.5;
    }
    if (spawnQueue.length === 0) spawning = false;
  }

  // ウェーブ終了チェック
  if (waveActive && !spawning && enemies.length === 0) {
    waveActive = false;
    document.getElementById('wave-btn').disabled = false;
    gold += 10 + wave * 2;
    // ウェーブ間でHP少し回復
    for (const a of allies) {
      a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.2);
    }
    updateHUD();
    updateAllyInfo();

    if (wave >= MAX_WAVE) {
      victory = true;
      document.getElementById('final-score2').textContent = score;
      document.getElementById('victory-overlay').style.display = 'flex';
    }
  }

  // 敵移動 & 戦闘
  for (const e of enemies) {
    if (!e.alive) continue;

    // スロー処理
    let spd = e.baseSpeed;
    if (e.slowTimer > 0) {
      spd *= (1 - (e._slowAmount || 0.3));
      e.slowTimer -= dt;
    }
    e.speed = spd;

    // 同じレーンの味方を探す
    const laneAlly = allies.find(a => a.lane === e.lane && a.hp > 0);

    if (laneAlly) {
      const distToAlly = laneAlly.x - e.x;
      // 味方に近づいたら攻撃
      if (distToAlly < 40) {
        // 近接戦闘
        e.attackCooldown -= dt;
        if (e.attackCooldown <= 0) {
          laneAlly.hp -= e.attackDamage;
          e.attackCooldown = e.attackSpeed;
          // 攻撃エフェクト
          for (let i = 0; i < 3; i++) {
            particles.push(createParticle(laneAlly.x - 15, laneAlly.y, '#ff4444'));
          }
          if (laneAlly.hp <= 0) {
            laneAlly.hp = 0;
            // 味方撃破エフェクト
            for (let i = 0; i < 15; i++) {
              particles.push(createParticle(laneAlly.x, laneAlly.y, laneAlly.color));
            }
          }
          updateAllyInfo();
        }
      } else {
        // 右へ移動
        e.x += spd * dt;
      }
    } else {
      // レーンに味方がいない → ゴールへ向かう
      e.x += spd * dt;

      if (e.x >= CANVAS_W + 20) {
        e.alive = false;
        lives -= e.damage;
        updateHUD();
        if (lives <= 0) {
          lives = 0;
          gameOver = true;
          document.getElementById('final-wave').textContent = wave;
          document.getElementById('final-score').textContent = score;
          document.getElementById('game-over-overlay').style.display = 'flex';
        }
      }
    }

    // ヒーラー: 周囲の敵を回復
    if (e.type === 'healer' && e.alive) {
      for (const other of enemies) {
        if (other === e || !other.alive) continue;
        const hd = Math.sqrt((other.x - e.x) ** 2 + (other.y - e.y) ** 2);
        if (hd < 100) {
          other.hp = Math.min(other.maxHp, other.hp + 15 * dt);
        }
      }
    }
  }

  // 死んだ敵除去
  enemies = enemies.filter(e => e.alive);

  // 味方攻撃
  for (const a of allies) {
    if (a.hp <= 0) continue;
    a.cooldown -= dt;
    if (a.attackAnim > 0) a.attackAnim -= dt;
    if (a.cooldown > 0) continue;

    // ターゲット探索（射程内で最も近い敵）
    let target = null;
    let bestDist = Infinity;

    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - a.x;
      const dy = e.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= a.range && dist < bestDist) {
        bestDist = dist;
        target = e;
      }
    }

    if (target) {
      a.cooldown = a.speed;
      a.angle = Math.atan2(target.y - a.y, target.x - a.x);
      a.attackAnim = 0.15;

      projectiles.push({
        x: a.x, y: a.y,
        tx: target.x, ty: target.y,
        target,
        damage: a.damage,
        splash: a.splash || 0,
        slow: a.slow || 0,
        speed: 400,
        color: a.color,
        alive: true,
      });
    }
  }

  // 弾移動
  for (const p of projectiles) {
    if (!p.alive) continue;
    if (p.target && p.target.alive) {
      p.tx = p.target.x;
      p.ty = p.target.y;
    }
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const move = p.speed * dt;

    if (dist <= move) {
      p.alive = false;
      if (p.splash > 0) {
        for (const e of enemies) {
          if (!e.alive) continue;
          const sd = Math.sqrt((e.x - p.tx) ** 2 + (e.y - p.ty) ** 2);
          if (sd <= p.splash) {
            dealDamage(e, p.damage * (1 - sd / p.splash * 0.5));
            if (p.slow > 0) {
              e.slowTimer = 1.5;
              e._slowAmount = p.slow;
            }
          }
        }
        for (let i = 0; i < 8; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      } else {
        if (p.target && p.target.alive) {
          dealDamage(p.target, p.damage);
          if (p.slow > 0) {
            p.target.slowTimer = 1.5;
            p.target._slowAmount = p.slow;
          }
        }
        for (let i = 0; i < 4; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      }
    } else {
      p.x += (dx / dist) * move;
      p.y += (dy / dist) * move;
    }
  }

  projectiles = projectiles.filter(p => p.alive);

  // パーティクル更新
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function dealDamage(enemy, dmg) {
  enemy.hp -= dmg;
  if (enemy.hp <= 0 && enemy.alive) {
    enemy.alive = false;
    gold += enemy.gold;
    score += enemy.score;
    updateHUD();
    updateAllyInfo();
    for (let i = 0; i < 12; i++) {
      particles.push(createParticle(enemy.x, enemy.y, enemy.color));
    }
  }
}

// ===== 描画 =====
function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // 空（グラデーション）
  const skyGrad = ctx.createLinearGradient(0, 0, 0, LANE_TOP);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(1, '#B0E0E6');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CANVAS_W, LANE_TOP);

  // 太陽
  ctx.beginPath();
  ctx.arc(650, 35, 25, 0, Math.PI * 2);
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(650, 35, 30, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.lineWidth = 1;

  // 雲
  drawCloud(100, 25, 40);
  drawCloud(300, 40, 30);
  drawCloud(500, 20, 35);

  // 草原の背景
  const grassGrad = ctx.createLinearGradient(0, LANE_TOP, 0, CANVAS_H);
  grassGrad.addColorStop(0, '#4CAF50');
  grassGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, LANE_TOP, CANVAS_W, CANVAS_H - LANE_TOP);

  // レーン描画
  for (let i = 0; i < LANE_COUNT; i++) {
    const y = LANE_TOP + i * LANE_H;

    // レーン背景（道）
    ctx.fillStyle = i % 2 === 0 ? 'rgba(139, 119, 80, 0.3)' : 'rgba(139, 119, 80, 0.2)';
    ctx.fillRect(0, y + 15, CANVAS_W, LANE_H - 30);

    // レーン区切り線
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(0, y + LANE_H);
    ctx.lineTo(CANVAS_W, y + LANE_H);
    ctx.stroke();
    ctx.setLineDash([]);

    // 草の装飾
    for (let gx = 20; gx < CANVAS_W; gx += 60) {
      const gy = y + LANE_H - 8 + Math.sin(gx * 0.1 + i) * 3;
      ctx.fillStyle = '#66BB6A';
      ctx.fillText('🌿', gx, gy);
    }
  }

  // 防衛ライン
  ctx.strokeStyle = 'rgba(255, 100, 100, 0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(GOAL_X + 30, LANE_TOP);
  ctx.lineTo(GOAL_X + 30, CANVAS_H);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 1;

  // 味方射程（選択時）
  if (selectedAlly && selectedAlly.hp > 0) {
    const a = selectedAlly;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.range, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
    ctx.fill();
    ctx.lineWidth = 1;
  }

  // 敵描画
  for (const e of enemies) {
    if (!e.alive) continue;

    // 影
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.radius + 2, e.radius * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();

    // 本体（円）
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.lineWidth = 1;

    // 絵文字
    ctx.font = `${e.radius * 1.4}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.emoji, e.x, e.y);

    // スロー表示
    if (e.slowTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100, 100, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    // HPバー
    const barW = e.radius * 2.5;
    const barH = 4;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 10;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#44cc44' : ratio > 0.25 ? '#cccc44' : '#cc4444';
    ctx.fillRect(barX, barY, barW * ratio, barH);

    // ボスには名前表示
    if (e.type === 'boss') {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ff8800';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(e.name, e.x, e.y - e.radius - 14);
    }
  }

  // 味方描画
  for (const a of allies) {
    // 影
    ctx.beginPath();
    ctx.ellipse(a.x, a.y + 22, 16, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();

    if (a.hp <= 0) {
      // 倒れた味方
      ctx.globalAlpha = 0.3;
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.icon, a.x, a.y);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#ff4444';
      ctx.fillText('💀', a.x, a.y - 20);
      ctx.globalAlpha = 1;
      continue;
    }

    // 攻撃アニメーション（ちょっと前に出る）
    let drawX = a.x;
    if (a.attackAnim > 0) {
      drawX -= 8 * (a.attackAnim / 0.15);
    }

    // 本体（丸い台座）
    ctx.beginPath();
    ctx.arc(drawX, a.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = a.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    // アイコン
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(a.icon, drawX, a.y);

    // レベル表示
    if (a.level > 1) {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('★' + a.level, drawX, a.y - 24);
    }

    // HPバー
    const barW = 40;
    const barH = 5;
    const barX = drawX - barW / 2;
    const barY = a.y + 26;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const hpRatio = a.hp / a.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? '#44cc44' : hpRatio > 0.25 ? '#cccc44' : '#cc4444';
    ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(barX, barY, barW, barH);

    // 選択ハイライト
    if (selectedAlly === a) {
      ctx.beginPath();
      ctx.arc(drawX, a.y, 24, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  // 弾描画
  for (const p of projectiles) {
    if (!p.alive) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 軌跡
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (dx/d)*10, p.y - (dy/d)*10);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  // パーティクル描画
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // ステータスバー（下部）
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, CANVAS_H - 25, CANVAS_W, 25);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const aliveAllies = allies.filter(a => a.hp > 0).length;
  const aliveEnemies = enemies.filter(e => e.alive).length;
  ctx.fillText(`味方: ${aliveAllies}/${LANE_COUNT}  |  敵: ${aliveEnemies}体  |  残ライフ: ${lives}`, 10, CANVAS_H - 12);
}

function drawCloud(x, y, size) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

function restartGame() {
  init();
}

// ===== 開始 =====
init();
requestAnimationFrame(gameLoop);
</script>
