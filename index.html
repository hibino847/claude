      '<div class="enh-level-bar">' + pips + '</div>';
    grid.appendChild(card);
  }
  renderEnhanceDetail();
}

function renderEnhanceDetail() {
  const detail = document.getElementById('enhance-detail');
  if (enhanceSelected < 0) {
    detail.style.display = 'none';
    return;
  }
  detail.style.display = 'block';
  const j = enhanceSelected;
  const def = ALLY_DEFS[j];
  const lv = enhanceLevels[j];
  const cur = getEnhanceBonus(lv);
  const maxed = lv >= ENHANCE_MAX;
  const cost = maxed ? 0 : getEnhanceCost(lv);
  const nxt = maxed ? cur : getEnhanceBonus(lv + 1);

  const dmgCur = Math.round(def.damage * cur.damageMult);
  const rngCur = Math.round(def.range + cur.rangePlus);
  const spdCur = (def.speed * cur.speedMult).toFixed(2);
  const dmgNxt = Math.round(def.damage * nxt.damageMult);
  const rngNxt = Math.round(def.range + nxt.rangePlus);
  const spdNxt = (def.speed * nxt.speedMult).toFixed(2);

  let statsHtml =
    '<div class="enh-stats">' +
      '<div class="enh-stat-item"><div class="enh-stat-label">攻撃力</div><div>' + dmgCur +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + dmgNxt + '</span>') + '</div></div>' +
      '<div class="enh-stat-item"><div class="enh-stat-label">射程</div><div>' + rngCur +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + rngNxt + '</span>') + '</div></div>' +
      '<div class="enh-stat-item"><div class="enh-stat-label">速度</div><div>' + spdCur + 's' +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + spdNxt + 's</span>') + '</div></div>' +
    '</div>';

  let btnHtml = maxed
    ? '<div style="color:#ffcc44;font-size:14px;font-weight:bold;">MAX</div>'
    : '<button id="enhance-do-btn" onclick="doEnhance()"' +
      (crystals < cost ? ' disabled' : '') +
      '>強化する (💎' + cost + ')</button>';

  detail.innerHTML =
    '<h3>' + def.icon + ' ' + def.name + ' Lv.' + lv + (maxed ? ' MAX' : '') + '</h3>' +
    statsHtml + btnHtml;
}

function doEnhance() {
  if (enhanceSelected < 0) return;
  const j = enhanceSelected;
  const lv = enhanceLevels[j];
  if (lv >= ENHANCE_MAX) return;
  const cost = getEnhanceCost(lv);
  if (crystals < cost) return;
  crystals -= cost;
  enhanceLevels[j]++;
  playSE('craft');
  renderEnhance();
}

// ===== 武器工房画面 =====
let weaponSelectedJob = -1; // 選択中の職業インデックス

function getWeaponsForJob(jobIdx) {
  // この職業が装備できる武器一覧を返す
  const result = [];
  for (let i = 0; i < WEAPON_DEFS.length; i++) {
    if (WEAPON_DEFS[i].jobs.includes(jobIdx)) {
      result.push(i);
    }
  }
  return result;
}

function openWeapon() {
  playSE('click');
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('weapon-screen').style.display = 'flex';
  weaponSelectedJob = -1;
  renderWeapon();
  setTimeout(fitToScreen, 0);
}

function closeWeapon() {
  document.getElementById('weapon-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'flex';
  updateMenuCrystal();
  autoSave();
  setTimeout(fitToScreen, 0);
}

function renderWeapon() {
  document.getElementById('weapon-crystal-count').textContent = crystals;
  const container = document.getElementById('weapon-slots');
  container.innerHTML = '';

  // 全職業を表示（重複除外）
  const shownJobs = [];
  for (let i = 0; i < ALLY_DEFS.length; i++) {
    shownJobs.push(i);
  }

  for (const jobIdx of shownJobs) {
    const jobDef = ALLY_DEFS[jobIdx];
    const w = weapons[jobIdx] || null;
    const slot = document.createElement('div');
    slot.className = 'weapon-slot' + (weaponSelectedJob === jobIdx ? ' selected' : '');
    slot.onclick = () => { weaponSelectedJob = (weaponSelectedJob === jobIdx) ? -1 : jobIdx; renderWeapon(); };
    if (w) {
      const wDef = WEAPON_DEFS[w.type];
      slot.innerHTML =
        '<div class="ws-job">' + jobDef.icon + ' ' + jobDef.name + '</div>' +
        '<div class="ws-icon">' + wDef.icon + '</div>' +
        '<div class="ws-name">' + wDef.name + '</div>' +
        '<div class="ws-refine">+' + w.refine + '</div>';
    } else {
      slot.innerHTML =
        '<div class="ws-job">' + jobDef.icon + ' ' + jobDef.name + '</div>' +
        '<div class="ws-empty">武器なし</div>';
    }
    container.appendChild(slot);
  }
  renderWeaponAction();
}

function renderWeaponAction() {
  const panel = document.getElementById('weapon-action');
  if (weaponSelectedJob < 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const jobIdx = weaponSelectedJob;
  const jobDef = ALLY_DEFS[jobIdx];
  const w = weapons[jobIdx] || null;
  const compatible = getWeaponsForJob(jobIdx);

  if (!w) {
    // 武器作成モード: 装備可能な武器だけ表示
    let html = '<h3>⚒️ ' + jobDef.icon + ' ' + jobDef.name + ' の武器作成</h3>';
    if (compatible.length === 0) {
      html += '<div style="color:#888;">装備可能な武器がありません</div>';
    } else {
      html += '<div id="weapon-craft-list">';
      for (const wIdx of compatible) {
        const d = WEAPON_DEFS[wIdx];
        html += '<button class="craft-btn" onclick="craftWeapon(' + wIdx + ')"' +
          (crystals < d.cost ? ' disabled' : '') + '>' +
          '<div class="craft-icon">' + d.icon + '</div>' +
          '<div class="craft-name">' + d.name + '</div>' +
          '<div class="craft-desc">' + d.desc + '</div>' +
          '<div class="craft-cost">💎' + d.cost + '</div>' +
          '</button>';
      }
      html += '</div>';
    }
    panel.innerHTML = html;
  } else {
    // 精錬モード
    const wDef = WEAPON_DEFS[w.type];
    const lv = w.refine;
    const maxed = lv >= REFINE_MAX;
    const cost = maxed ? 0 : getRefineCost(lv);
    const rate = maxed ? 0 : getRefineRate(lv);
    const curB = getRefineBonus(lv);
    const nxtB = maxed ? curB : getRefineBonus(lv + 1);

    const atkCur = Math.round(wDef.atkMult * curB.atkMult * 100);
    const rngCur = Math.round(wDef.rangePlus + curB.rangePlus);
    const spdCur = Math.round(wDef.speedMult * curB.speedMult * 100);
    const atkNxt = Math.round(wDef.atkMult * nxtB.atkMult * 100);
    const rngNxt = Math.round(wDef.rangePlus + nxtB.rangePlus);
    const spdNxt = Math.round(wDef.speedMult * nxtB.speedMult * 100);

    let html = '<div id="weapon-refine-panel">' +
      '<h3>' + wDef.icon + ' ' + wDef.name + ' +' + lv + (maxed ? ' MAX' : '') +
      ' <span style="font-size:12px;color:#a0c090;">(' + jobDef.icon + jobDef.name + ')</span></h3>' +
      '<div style="font-size:11px;color:#a0c090;margin-bottom:6px;">' + wDef.desc + '</div>' +
      '<div class="refine-stats">' +
        '<div><div class="refine-stat-label">攻撃倍率</div>' + atkCur + '%' +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + atkNxt + '%</span>') + '</div>' +
        '<div><div class="refine-stat-label">射程+</div>' + rngCur +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + rngNxt + '</span>') + '</div>' +
        '<div><div class="refine-stat-label">速度倍率</div>' + spdCur + '%' +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + spdNxt + '%</span>') + '</div>' +
      '</div>';

    if (maxed) {
      html += '<div style="color:#ffcc44;font-weight:bold;">精錬MAX!</div>';
    } else {
      html += '<button class="refine-btn" onclick="refineWeapon()"' +
        (crystals < cost ? ' disabled' : '') +
        '>精錬する (💎' + cost + ')</button>' +
        '<div class="refine-rate">成功率: <span style="color:' +
        (rate >= 70 ? '#44ff44' : rate >= 50 ? '#ffcc44' : '#ff6644') +
        '">' + rate + '%</span></div>';
    }
    html += '<div id="refine-result"></div>';
    // 別の武器に変更ボタン
    if (compatible.length > 1) {
      html += '<div style="margin-top:10px;border-top:1px solid #553;padding-top:8px;">' +
        '<div style="font-size:11px;color:#a0c090;margin-bottom:6px;">武器を変更:</div>' +
        '<div id="weapon-craft-list">';
      for (const wIdx of compatible) {
        if (wIdx === w.type) continue;
        const d = WEAPON_DEFS[wIdx];
        html += '<button class="craft-btn" onclick="swapWeapon(' + wIdx + ')"' +
          (crystals < d.cost ? ' disabled' : '') + '>' +
          '<div class="craft-icon">' + d.icon + '</div>' +
          '<div class="craft-name">' + d.name + '</div>' +
          '<div class="craft-desc">' + d.desc + '</div>' +
          '<div class="craft-cost">💎' + d.cost + '</div>' +
          '</button>';
      }
      html += '</div></div>';
    }
    html += '<button class="discard-btn" onclick="discardWeapon()">武器を破棄</button>';
    html += '</div>';
    panel.innerHTML = html;
  }
}

function craftWeapon(typeIdx) {
  if (weaponSelectedJob < 0) return;
  const d = WEAPON_DEFS[typeIdx];
  if (crystals < d.cost) return;
  if (!d.jobs.includes(weaponSelectedJob)) return;
  crystals -= d.cost;
  weapons[weaponSelectedJob] = { type: typeIdx, refine: 0 };
  playSE('craft');
  renderWeapon();
}

function swapWeapon(typeIdx) {
  if (weaponSelectedJob < 0) return;
  const d = WEAPON_DEFS[typeIdx];
  if (crystals < d.cost) return;
  if (!d.jobs.includes(weaponSelectedJob)) return;
  crystals -= d.cost;
  weapons[weaponSelectedJob] = { type: typeIdx, refine: 0 };
  renderWeapon();
}

function refineWeapon() {
  if (weaponSelectedJob < 0) return;
  const w = weapons[weaponSelectedJob];
  if (!w || w.refine >= REFINE_MAX) return;
  const cost = getRefineCost(w.refine);
  if (crystals < cost) return;
  crystals -= cost;
  const rate = getRefineRate(w.refine);
  const success = Math.random() * 100 < rate;
  if (success) {
    w.refine++;
    playSE('refine_ok');
    renderWeapon();
    document.getElementById('refine-result').innerHTML =
      '<span style="color:#44ff44;">✨ 精錬成功！ +' + w.refine + ' に強化！</span>';
  } else {
    playSE('refine_fail');
    renderWeapon();
    document.getElementById('refine-result').innerHTML =
      '<span style="color:#ff4444;">💥 精錬失敗... 結晶を失った</span>';
  }
}

function discardWeapon() {
  if (weaponSelectedJob < 0) return;
  delete weapons[weaponSelectedJob];
  renderWeapon();
}

// ===== 任務選択画面 =====
let missionSelected = -1;

function openMission() {
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('mission-screen').style.display = 'flex';
  missionSelected = -1;
  renderMission();
  setTimeout(fitToScreen, 0);
}

function closeMission() {
  document.getElementById('mission-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'flex';
  setTimeout(fitToScreen, 0);
}

function isMissionUnlocked(idx) {
  const m = MISSION_DEFS[idx];
  if (m.unlock === 0) return true;
  // unlock = N means need to clear mission N-1
  return missionClears[m.unlock - 1];
}

function renderMission() {
  const list = document.getElementById('mission-list');
  list.innerHTML = '';
  for (let i = 0; i < MISSION_DEFS.length; i++) {
    const m = MISSION_DEFS[i];
    const unlocked = isMissionUnlocked(i);
    const card = document.createElement('div');
    card.className = 'mission-card' + (missionSelected === i ? ' selected' : '') + (!unlocked ? ' locked' : '');
    if (unlocked) {
      card.onclick = () => { missionSelected = (missionSelected === i) ? -1 : i; renderMission(); };
    }

    let starsHtml = '<div class="mc-difficulty">';
    for (let s = 0; s < 6; s++) {
      starsHtml += '<span class="mc-star ' + (s < m.stars ? 'filled' : 'empty') + '">★</span>';
    }
    starsHtml += '</div>';

    card.innerHTML =
      '<div class="mc-icon">' + m.icon + '</div>' +
      '<div class="mc-name">' + (unlocked ? m.name : '???') + '</div>' +
      '<div class="mc-desc">' + (unlocked ? m.desc : '前の任務をクリアしよう') + '</div>' +
      '<div class="mc-info">' +
        '<span>' + m.waves + ' Wave</span>' +
        '<span>💎 ' + m.reward + ' (初回x2)</span>' +
      '</div>' +
      starsHtml +
      (missionClears[i] ? '<div class="mc-clear">✅ クリア済み</div>' : '');
    list.appendChild(card);
  }

  renderMissionDetail();
  document.getElementById('mission-start-btn').disabled = (missionSelected < 0);
}

function renderMissionDetail() {
  const detail = document.getElementById('mission-detail');
  if (missionSelected < 0) { detail.style.display = 'none'; return; }
  detail.style.display = 'block';
  const m = MISSION_DEFS[missionSelected];

  const diffLabel = m.stars <= 2 ? '初級' : m.stars <= 4 ? '中級' : '上級';
  const diffColor = m.stars <= 2 ? '#44ff44' : m.stars <= 4 ? '#ffcc44' : '#ff4444';

  detail.innerHTML =
    '<h3>' + m.icon + ' ' + m.name + '</h3>' +
    '<div class="md-stats">' +
      '<div class="md-stat-item"><div class="md-stat-label">Wave数</div><div>' + m.waves + '</div></div>' +
      '<div class="md-stat-item"><div class="md-stat-label">敵HP倍率</div><div>x' + m.hpMult.toFixed(1) + '</div></div>' +
      '<div class="md-stat-item"><div class="md-stat-label">敵速度倍率</div><div>x' + m.speedMult.toFixed(1) + '</div></div>' +
      '<div class="md-stat-item"><div class="md-stat-label">難易度</div><div style="color:' + diffColor + '">' + diffLabel + '</div></div>' +
    '</div>' +
    '<div style="font-size:13px; color:#ffcc44; margin-bottom:4px;">💎 報酬: ' + m.reward + ' 結晶' +
      (!missionClears[missionSelected] ? ' <span style="color:#44ff44;">(初回クリア: +' + m.reward + ' ボーナス)</span>' : '') +
    '</div>' +
    '<div style="font-size:11px; color:#a0c090;">' + m.desc + '</div>';
}

function startMission() {
  if (missionSelected < 0) return;
  ensureAudio();
  currentMission = missionSelected;
  document.getElementById('mission-screen').style.display = 'none';
  document.getElementById('game-header').style.display = 'flex';
  document.getElementById('game-container').style.display = 'flex';
  init();
  playBgm('battle');
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(fitToScreen, 0);
}

// ===== 転職画面 =====
let jcSelected = -1; // 選択中の上位職インデックス

function openJobChange() {
  playSE('click');
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('jobchange-screen').style.display = 'flex';
  jcSelected = -1;
  renderJobChange();
  setTimeout(fitToScreen, 0);
}

function closeJobChange() {
  document.getElementById('jobchange-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'flex';
  updateMenuCrystal();
  autoSave();
  setTimeout(fitToScreen, 0);
}

function renderJobChange() {
  document.getElementById('jobchange-crystal-count').textContent = crystals;
  const grid = document.getElementById('jobchange-grid');
  grid.innerHTML = '';

  for (let i = 0; i < ADVANCED_DEFS.length; i++) {
    const adv = ADVANCED_DEFS[i];
    const baseDef = ALLY_DEFS[adv.baseJob];
    const lv = allyLevels[adv.baseJob];
    const canExam = lv >= adv.reqLevel;
    const passed = examPassed[i];
    const changed = jobChanged[adv.baseJob];

    const card = document.createElement('div');
    let cls = 'jc-card';
    if (changed) cls += ' changed';
    else if (passed) cls += ' passed';
    else if (!canExam) cls += ' locked';
    if (jcSelected === i) cls += ' selected';
    card.className = cls;
    card.onclick = () => { jcSelected = i; renderJobChange(); };

    let statusText = '';
    let statusColor = '#888';
    if (changed) { statusText = '転職済み'; statusColor = '#ffd700'; }
    else if (passed) { statusText = '合格済み'; statusColor = '#44ff44'; }
    else if (canExam) { statusText = '受験可能'; statusColor = '#aa44ff'; }
    else { statusText = 'Lv.' + adv.reqLevel + ' 必要'; statusColor = '#ff6666'; }

    card.innerHTML =
      '<div class="jc-icon">' + adv.icon + '</div>' +
      '<div class="jc-name">' + adv.name + '</div>' +
      '<div class="jc-base">' + baseDef.icon + ' ' + baseDef.name + ' Lv.' + lv + '</div>' +
      '<div class="jc-status" style="color:' + statusColor + ';">' + statusText + '</div>';
    grid.appendChild(card);
  }

  renderJobChangeDetail();
}

function renderJobChangeDetail() {
  const detail = document.getElementById('jobchange-detail');
  const action = document.getElementById('jobchange-action');

  if (jcSelected < 0) {
    detail.style.display = 'none';
    action.innerHTML = '';
    return;
  }

  detail.style.display = 'block';
  const adv = ADVANCED_DEFS[jcSelected];
  const baseDef = ALLY_DEFS[adv.baseJob];
  const lv = allyLevels[adv.baseJob];
  const canExam = lv >= adv.reqLevel;
  const passed = examPassed[jcSelected];
  const changed = jobChanged[adv.baseJob];

  // ステータス比較
  detail.innerHTML =
    '<h3>' + adv.icon + ' ' + adv.name + '</h3>' +
    '<div style="font-size:12px; color:#c0b0e0; margin-bottom:8px;">' + adv.desc + '</div>' +
    '<div class="jc-compare">' +
      '<div class="jc-compare-col">' +
        '<h4 style="color:#aaa;">' + baseDef.icon + ' ' + baseDef.name + '</h4>' +
        '<div class="jc-stat"><span>攻撃力</span> <span>' + baseDef.damage + '</span></div>' +
        '<div class="jc-stat"><span>射程</span> <span>' + baseDef.range + '</span></div>' +
        '<div class="jc-stat"><span>速度</span> <span>' + baseDef.speed.toFixed(2) + 's</span></div>' +
        '<div class="jc-stat"><span>HP</span> <span>' + baseDef.maxHp + '</span></div>' +
      '</div>' +
      '<div class="jc-arrow">→</div>' +
      '<div class="jc-compare-col">' +
        '<h4 style="color:#ffd700;">' + adv.icon + ' ' + adv.name + '</h4>' +
        '<div class="jc-stat"><span>攻撃力</span> <span style="color:' + (adv.damage > baseDef.damage ? '#44ff44' : '#ff6666') + ';">' + adv.damage + '</span></div>' +
        '<div class="jc-stat"><span>射程</span> <span style="color:' + (adv.range > baseDef.range ? '#44ff44' : '#ff6666') + ';">' + adv.range + '</span></div>' +
        '<div class="jc-stat"><span>速度</span> <span style="color:' + (adv.speed < baseDef.speed ? '#44ff44' : adv.speed > baseDef.speed ? '#ff6666' : '#fff') + ';">' + adv.speed.toFixed(2) + 's</span></div>' +
        '<div class="jc-stat"><span>HP</span> <span style="color:' + (adv.maxHp > baseDef.maxHp ? '#44ff44' : '#ff6666') + ';">' + adv.maxHp + '</span></div>' +
      '</div>' +
    '</div>' +
    (canExam && !passed ? '<div style="font-size:12px; color:#ffcc44;">試験費用: 💎 ' + adv.examCost + ' 結晶</div>' : '') +
    (passed && !changed ? '<div style="font-size:12px; color:#44ff44;">試験合格済み！転職可能です</div>' : '');

  // アクションボタン
  let actionHtml = '';
  if (changed) {
    actionHtml = '<div style="color:#ffd700; font-size:14px; font-weight:bold;">転職完了済み</div>';
  } else if (passed) {
    actionHtml = '<button onclick="doJobChange(' + jcSelected + ')">転職する</button>';
  } else if (canExam) {
    const canAfford = crystals >= adv.examCost;
    actionHtml = '<button onclick="takeExam(' + jcSelected + ')"' + (canAfford ? '' : ' disabled') + '>試験を受ける (💎' + adv.examCost + ')</button>';
    if (!canAfford) actionHtml += '<div style="color:#ff6666; font-size:11px; margin-top:4px;">結晶が足りません</div>';
  } else {
    actionHtml = '<div style="color:#ff6666; font-size:12px;">' + baseDef.name + ' をLv.' + adv.reqLevel + ' にする必要があります (現在 Lv.' + lv + ')</div>';
  }
  action.innerHTML = actionHtml;
}

function takeExam(advIdx) {
  const adv = ADVANCED_DEFS[advIdx];
  if (crystals < adv.examCost) return;
  if (allyLevels[adv.baseJob] < adv.reqLevel) return;
  if (examPassed[advIdx]) return;

  crystals -= adv.examCost;
  // 試験: 成功率はレベル依存 (Lv10で60%, Lv20で80%, Lv30で100%)
  const lv = allyLevels[adv.baseJob];
  const rate = Math.min(100, 40 + lv * 2);
  const roll = Math.random() * 100;

  if (roll < rate) {
    examPassed[advIdx] = true;
    playSE('exam_pass');
    alert(adv.name + ' の試験に合格しました！ (成功率: ' + rate + '%)');
  } else {
    playSE('exam_fail');
    alert(adv.name + ' の試験に失敗... (成功率: ' + rate + '%)  費用は消費されました。');
  }

  renderJobChange();
}

function doJobChange(advIdx) {
  const adv = ADVANCED_DEFS[advIdx];
  if (!examPassed[advIdx]) return;
  if (jobChanged[adv.baseJob]) return;

  // 基本職のステータスを上位職に差し替え
  const base = ALLY_DEFS[adv.baseJob];
  base.name = adv.name;
  base.icon = adv.icon;
  base.damage = adv.damage;
  base.range = adv.range;
  base.speed = adv.speed;
  base.maxHp = adv.maxHp;
  base.color = adv.color;
  base.desc = adv.desc;
  if (adv.splash) base.splash = adv.splash;
  if (adv.slow) base.slow = adv.slow;

  jobChanged[adv.baseJob] = true;
  alert(ALLY_DEFS[adv.baseJob].name + ' に転職しました！');
  renderJobChange();
}

// ===== 画面フィット =====
function fitToScreen() {
  const wrapper = document.getElementById('app-wrapper');
  const isMobile = window.innerWidth < 960;

  if (isMobile) {
    // 一旦transformをリセットして実際の幅・高さを計測
    wrapper.style.transform = 'none';
    wrapper.style.marginBottom = '0';
    const actualW = wrapper.scrollWidth;
    const actualH = wrapper.scrollHeight;
    const s = window.innerWidth / actualW;
    wrapper.style.transform = 'scale(' + s + ')';
    wrapper.style.transformOrigin = 'top left';
    wrapper.style.marginTop = '0';
    wrapper.style.marginBottom = -(actualH - actualH * s) + 'px';
  } else {
    const contentW = 960;
    const contentH = 640;
    const scaleX = window.innerWidth / contentW;
    const scaleY = window.innerHeight / contentH;
    const s = Math.min(scaleX, scaleY, 1);
    wrapper.style.transform = 'scale(' + s + ')';
    wrapper.style.transformOrigin = 'top center';
    const scaledH = contentH * s;
    wrapper.style.marginBottom = -(contentH - scaledH) + 'px';
    wrapper.style.marginTop = Math.max(0, (window.innerHeight - scaledH) / 2) + 'px';
  }
}

window.addEventListener('resize', fitToScreen);

  if (confirm('本当にセーブデータを削除しますか？\n全ての進行状況が失われます。')) {
    deleteSave();
    alert('データを削除しました。ページを再読み込みします。');

  ensureAudio();
  setMuted(checked);

function updateSaveInfo() {
  const el = document.getElementById('save-info');
  const info = getSaveInfo();
  if (!info) {
    el.textContent = 'セーブデータなし';
    return;
  }
  let text = '💎' + info.crystals + ' | 最高Lv.' + info.maxLevel;
  if (info.savedAt) {
    const d = info.savedAt;
    text += ' | ' + d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  el.textContent = text;
}
