<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伝説のまもりびと - 横スクロールタワーディフェンス</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a2a1a;
  color: #e0ffe0;
  font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  user-select: none;
}

#app-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: top center;
}

#game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 960px;
  padding: 8px 16px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border-bottom: 2px solid #4a8a2a;
}

#game-header h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hud-info {
  display: flex;
  gap: 20px;
  font-size: 14px;
}

.hud-info span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.gold-icon { color: #ffd700; }
.life-icon { color: #ff4444; }
.wave-icon { color: #44aaff; }

#game-container {
  position: relative;
  display: flex;
  gap: 0;
}

canvas {
  display: block;
  cursor: pointer;
  border: 2px solid #4a8a2a;
  border-right: none;
}

#side-panel {
  width: 200px;
  background: linear-gradient(180deg, #2d4a1e, #1a2a1a);
  border: 2px solid #4a8a2a;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 600px;
  overflow-y: auto;
}

#side-panel h3 {
  font-size: 14px;
  text-align: center;
  color: #ffd700;
  border-bottom: 1px solid #4a8a2a;
  padding-bottom: 6px;
}

.ally-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  color: #e0ffe0;
}

.ally-btn:hover {
  background: rgba(74, 138, 42, 0.6);
  transform: scale(1.02);
}

.ally-btn.selected {
  background: rgba(255, 215, 0, 0.2);
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.ally-btn .ally-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.ally-btn .ally-name {
  font-size: 12px;
  font-weight: bold;
}

.ally-btn .ally-desc {
  font-size: 10px;
  color: #a0c090;
  text-align: center;
  margin-top: 2px;
}

#ally-info {
  background: rgba(0,0,0,0.3);
  border: 1px solid #4a8a2a;
  border-radius: 6px;
  padding: 8px;
  font-size: 11px;
  display: none;
}

#ally-info h4 {
  color: #ffd700;
  margin-bottom: 4px;
}

#ally-info .stat {
  display: flex;
  justify-content: space-between;
  margin: 2px 0;
}

.speed-btn {
  padding: 4px 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 1px solid #4a8a2a;
  border-radius: 4px;
  color: #e0ffe0;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}

.speed-btn.active {
  background: rgba(255, 215, 0, 0.3);
  border-color: #ffd700;
}

#game-over-overlay, #victory-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 760px; height: 600px;
  background: rgba(0, 0, 0, 0.85);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#game-over-overlay h2 {
  font-size: 48px;
  color: #ff4444;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff0000;
}

#victory-overlay h2 {
  font-size: 48px;
  color: #ffd700;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ffaa00;
}

#game-over-overlay p, #victory-overlay p {
  font-size: 18px;
  margin-bottom: 30px;
}

#restart-btn, #restart-btn2, #menu-btn, #menu-btn2 {
  padding: 12px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#restart-btn:hover, #restart-btn2:hover, #menu-btn:hover, #menu-btn2:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* メニュー画面 */
#menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a3a10, #0d1a0d);
  border: 2px solid #4a8a2a;
}

#menu-screen h1 {
  font-size: 48px;
  background: linear-gradient(90deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 60px;
  text-shadow: none;
}

#menu-buttons {
  display: flex;
  gap: 16px;
}

.menu-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 140px;
  height: 100px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  border: 2px solid;
  transition: all 0.2s;
}

.menu-btn .menu-btn-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.menu-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
}

.menu-btn.btn-sortie {
  background: linear-gradient(180deg, #aa4400, #883300);
  border-color: #ff8800;
}

.menu-btn.btn-sortie:hover {
  background: linear-gradient(180deg, #cc5500, #aa4400);
  box-shadow: 0 0 20px rgba(255, 136, 0, 0.4);
}

.menu-btn.btn-formation {
  background: linear-gradient(180deg, #2a5a8a, #1a3a5a);
  border-color: #4a9aee;
}

.menu-btn.btn-formation:hover {
  background: linear-gradient(180deg, #3a6a9a, #2a5a8a);
  box-shadow: 0 0 20px rgba(74, 154, 238, 0.4);
}

.menu-btn.btn-enhance {
  background: linear-gradient(180deg, #6a2a8a, #4a1a5a);
  border-color: #aa5aee;
}

.menu-btn.btn-enhance:hover {
  background: linear-gradient(180deg, #7a3a9a, #6a2a8a);
  box-shadow: 0 0 20px rgba(170, 90, 238, 0.4);
}

.menu-btn.btn-jobchange {
  background: linear-gradient(180deg, #2a7a3a, #1a5a2a);
  border-color: #4aea5a;
}

.menu-btn.btn-jobchange:hover {
  background: linear-gradient(180deg, #3a8a4a, #2a7a3a);
  box-shadow: 0 0 20px rgba(74, 234, 90, 0.4);
}

.menu-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* 編成画面 */
#formation-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a3a10, #0d1a0d);
  border: 2px solid #4a8a2a;
}

#formation-screen h2 {
  font-size: 28px;
  color: #4a9aee;
  margin-bottom: 30px;
}

#formation-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 30px;
}

.formation-slot {
  width: 200px;
  padding: 16px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #4a8a2a;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.formation-slot:hover {
  border-color: #4a9aee;
  background: rgba(74, 154, 238, 0.15);
}

.formation-slot.active {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.formation-slot .slot-label {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 6px;
}

.formation-slot .slot-icon {
  font-size: 36px;
  margin-bottom: 4px;
}

.formation-slot .slot-name {
  font-size: 16px;
  font-weight: bold;
}

.formation-slot .slot-desc {
  font-size: 11px;
  color: #a0c090;
  margin-top: 4px;
}

#job-picker {
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
  max-width: 520px;
}

.job-pick-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 110px;
  padding: 10px 8px;
  background: rgba(74, 138, 42, 0.3);
  border: 2px solid #4a8a2a;
  border-radius: 8px;
  cursor: pointer;
  color: #e0ffe0;
  font-family: inherit;
  transition: all 0.2s;
}

.job-pick-btn:hover {
  background: rgba(74, 138, 42, 0.6);
  transform: scale(1.05);
}

.job-pick-btn .pick-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.job-pick-btn .pick-name {
  font-size: 13px;
  font-weight: bold;
}

#formation-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#formation-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* 強化画面 */
#enhance-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a1a30, #0d0d1a);
  border: 2px solid #aa5aee;
  padding: 20px 0;
  overflow-y: auto;
}

#enhance-screen h2 {
  font-size: 28px;
  color: #aa5aee;
  margin-bottom: 6px;
}

#enhance-crystal-display {
  font-size: 16px;
  color: #ffcc44;
  margin-bottom: 16px;
}

#enhance-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 16px;
}

.enhance-card {
  width: 140px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #555;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.enhance-card:hover {
  border-color: #aa5aee;
  background: rgba(170, 90, 238, 0.1);
}

.enhance-card.selected {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.enhance-card .enh-icon {
  font-size: 30px;
  margin-bottom: 2px;
}

.enhance-card .enh-name {
  font-size: 13px;
  font-weight: bold;
}

.enhance-card .enh-level {
  font-size: 11px;
  color: #ffcc44;
  margin-top: 2px;
}

.enhance-card .enh-level-bar {
  display: flex;
  gap: 2px;
  justify-content: center;
  margin-top: 4px;
}

.enhance-card .enh-pip {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: #333;
  border: 1px solid #555;
}

.enhance-card .enh-pip.filled {
  background: #aa5aee;
  border-color: #cc7aff;
}

#enhance-detail {
  display: none;
  background: rgba(0,0,0,0.5);
  border: 1px solid #aa5aee;
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 16px;
  width: 500px;
  text-align: center;
}

#enhance-detail h3 {
  font-size: 18px;
  color: #ffd700;
  margin-bottom: 8px;
}

#enhance-detail .enh-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 13px;
  margin-bottom: 10px;
}

#enhance-detail .enh-stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

#enhance-detail .enh-stat-label {
  color: #a0c090;
  font-size: 11px;
}

#enhance-detail .enh-stat-arrow {
  color: #44ff44;
}

#enhance-do-btn {
  padding: 8px 24px;
  background: linear-gradient(180deg, #6a2a8a, #4a1a5a);
  border: 2px solid #aa5aee;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

#enhance-do-btn:hover {
  background: linear-gradient(180deg, #7a3a9a, #6a2a8a);
  box-shadow: 0 0 12px rgba(170, 90, 238, 0.4);
}

#enhance-do-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#enhance-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#enhance-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

/* 武器工房画面 */
#weapon-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #2a1a0a, #1a0d00);
  border: 2px solid #cc8844;
  padding: 16px 0;
  overflow-y: auto;
}

#weapon-screen h2 {
  font-size: 28px;
  color: #cc8844;
  margin-bottom: 4px;
}

#weapon-crystal-display {
  font-size: 14px;
  color: #ffcc44;
  margin-bottom: 12px;
}

#weapon-slots {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}

.weapon-slot {
  width: 140px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #665533;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.weapon-slot:hover {
  border-color: #cc8844;
  background: rgba(204, 136, 68, 0.1);
}

.weapon-slot.selected {
  border-color: #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

.weapon-slot .ws-job {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 4px;
}

.weapon-slot .ws-icon {
  font-size: 28px;
}

.weapon-slot .ws-name {
  font-size: 12px;
  font-weight: bold;
  margin-top: 2px;
}

.weapon-slot .ws-refine {
  font-size: 11px;
  color: #ffcc44;
}

.weapon-slot .ws-empty {
  font-size: 12px;
  color: #888;
  padding: 8px 0;
}

#weapon-action {
  display: none;
  background: rgba(0,0,0,0.5);
  border: 1px solid #cc8844;
  border-radius: 10px;
  padding: 14px 20px;
  margin-bottom: 12px;
  width: 580px;
  text-align: center;
}

#weapon-action h3 {
  font-size: 16px;
  color: #ffd700;
  margin-bottom: 10px;
}

#weapon-craft-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
}

.craft-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 12px;
  background: rgba(204, 136, 68, 0.2);
  border: 2px solid #886633;
  border-radius: 8px;
  cursor: pointer;
  color: #e0ffe0;
  font-family: inherit;
  transition: all 0.2s;
  width: 100px;
}

.craft-btn:hover {
  background: rgba(204, 136, 68, 0.4);
  border-color: #cc8844;
}

.craft-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.craft-btn .craft-icon { font-size: 24px; }
.craft-btn .craft-name { font-size: 11px; font-weight: bold; }
.craft-btn .craft-cost { font-size: 10px; color: #ffcc44; }

#weapon-refine-panel {
  text-align: center;
}

#weapon-refine-panel .refine-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 13px;
  margin: 8px 0;
}

#weapon-refine-panel .refine-stat-label {
  color: #a0c090;
  font-size: 11px;
}

#weapon-refine-panel .refine-arrow {
  color: #44ff44;
}

.refine-btn {
  padding: 8px 24px;
  background: linear-gradient(180deg, #8a5a2a, #5a3a1a);
  border: 2px solid #cc8844;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.refine-btn:hover {
  background: linear-gradient(180deg, #aa7a4a, #8a5a2a);
  box-shadow: 0 0 12px rgba(204, 136, 68, 0.4);
}

.refine-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.refine-rate {
  font-size: 12px;
  margin-top: 6px;
}

#refine-result {
  font-size: 14px;
  font-weight: bold;
  margin-top: 8px;
  min-height: 20px;
}

.discard-btn {
  padding: 4px 16px;
  background: rgba(150, 50, 50, 0.3);
  border: 1px solid #cc4444;
  border-radius: 4px;
  color: #ff8888;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
}

.discard-btn:hover { background: rgba(150, 50, 50, 0.6); }

#weapon-back-btn {
  padding: 10px 40px;
  background: linear-gradient(180deg, #4a8a2a, #2d4a1e);
  border: 2px solid #6aaa3a;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

#weapon-back-btn:hover {
  background: linear-gradient(180deg, #6aaa3a, #4a8a2a);
}

.menu-btn.btn-weapon {
  background: linear-gradient(180deg, #8a5a2a, #5a3a1a);
  border-color: #cc8844;
}

.menu-btn.btn-weapon:hover {
  background: linear-gradient(180deg, #aa7a4a, #8a5a2a);
  box-shadow: 0 0 20px rgba(204, 136, 68, 0.4);
}

/* 任務選択画面 */
#mission-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 960px;
  height: 640px;
  background: linear-gradient(180deg, #1a2a0a, #0d1a00);
  border: 2px solid #ff8800;
  padding: 20px 0;
  overflow-y: auto;
}

#mission-screen h2 {
  font-size: 28px;
  color: #ff8800;
  margin-bottom: 16px;
}

#mission-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 24px;
  margin-bottom: 20px;
}

.mission-card {
  width: 180px;
  padding: 14px 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #665522;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: #e0ffe0;
}

.mission-card:hover {
  border-color: #ff8800;
  background: rgba(255, 136, 0, 0.1);
  transform: scale(1.03);
}

.mission-card.selected {
  border-color: #ffd700;
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
}

.mission-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.mission-card.locked:hover {
  transform: none;
  border-color: #665522;
  background: rgba(0,0,0,0.4);
}

.mission-card .mc-icon {
  font-size: 36px;
  margin-bottom: 6px;
}

.mission-card .mc-name {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 4px;
}

.mission-card .mc-desc {
  font-size: 11px;
  color: #a0c090;
  margin-bottom: 6px;
}

.mission-card .mc-info {
  font-size: 11px;
  color: #ffcc44;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}

.mission-card .mc-difficulty {
  display: flex;
  gap: 2px;
  justify-content: center;
  margin-top: 4px;
}

.mission-card .mc-star {
  font-size: 12px;
}

.mission-card .mc-star.filled {
  color: #ffd700;
}

.mission-card .mc-star.empty {
  color: #555;
}

.mission-card .mc-clear {
  font-size: 10px;
  color: #44ff44;
  margin-top: 4px;
}

#mission-detail {

<script>
// ===== ゲーム定数 =====
const CANVAS_W = 760;
const CANVAS_H = 600;
const LANE_COUNT = 4;
const LANE_H = 100;
const LANE_TOP = 80;  // レーンの開始Y位置
const GOAL_X = 700;   // 味方の防衛ライン（右側）
const SPAWN_X = -30;  // 敵のスポーン位置（左端の外）
const MAX_WAVE = 30;

// コア（防衛対象）
const CORE_X = 730;
const CORE_Y = 280;
const CORE_MAX_HP = 500;

// 味方配置（2x2グリッド: 上2人、下2人）
const ALLY_POSITIONS = [
  { x: 580, y: 180 },  // 剣士 - 前列上
  { x: 660, y: 180 },  // 弓兵 - 後列上
  { x: 580, y: 380 },  // 魔法使い - 前列下
  { x: 660, y: 380 },  // 聖騎士 - 後列下
];

// 味方ユニット定義
const ALLY_DEFS = [
  { name: '剣士', icon: '⚔️', damage: 20, range: 80, speed: 0.8, maxHp: 150, color: '#cc4444',
    desc: '近距離の高火力アタッカー' },
  { name: '弓兵', icon: '🏹', damage: 12, range: 200, speed: 1.0, maxHp: 80, color: '#44cc44',
    desc: '遠距離の安定した攻撃' },
  { name: '魔法使い', icon: '🔮', damage: 18, range: 180, speed: 1.5, maxHp: 70, color: '#8844ff',
    desc: '範囲攻撃＋スロー効果', splash: 60, slow: 0.3 },
  { name: '聖騎士', icon: '🛡️', damage: 15, range: 100, speed: 1.0, maxHp: 250, color: '#ffcc00',
    desc: '高耐久の守護者' },
  { name: '忍者', icon: '🗡️', damage: 10, range: 120, speed: 0.4, maxHp: 90, color: '#6644aa',
    desc: '超高速の連続攻撃' },
  { name: '槍兵', icon: '🔱', damage: 16, range: 140, speed: 1.0, maxHp: 130, color: '#cc8844',
    desc: '中距離の範囲突撃', splash: 40 },
  { name: '狙撃手', icon: '🎯', damage: 45, range: 300, speed: 2.5, maxHp: 60, color: '#228888',
    desc: '超長射程の一撃必殺' },
  { name: '踊り子', icon: '💃', damage: 8, range: 160, speed: 1.2, maxHp: 70, color: '#ee55aa',
    desc: '攻撃＋全体スロー付与', splash: 80, slow: 0.2 },
];

// 編成データ（各スロットの職業インデックス）
let formation = [0, 1, 2, 3]; // デフォルト: 剣士, 弓兵, 魔法使い, 聖騎士
const SLOT_LABELS = ['前列・上', '後列・上', '前列・下', '後列・下'];

// 武器定義
const WEAPON_DEFS = [
  { name: '鉄の剣', icon: '🗡️', atkMult: 1.3, rangePlus: 0, speedMult: 1.0, cost: 20, desc: '攻撃力重視' },
  { name: '鉄の弓', icon: '🏹', atkMult: 1.1, rangePlus: 30, speedMult: 1.0, cost: 20, desc: '射程重視' },
  { name: '魔法の杖', icon: '🪄', atkMult: 1.15, rangePlus: 15, speedMult: 0.9, cost: 30, desc: '攻撃速度+射程' },
  { name: '鉄の槍', icon: '🔱', atkMult: 1.2, rangePlus: 20, speedMult: 1.0, cost: 25, desc: 'バランス型' },
  { name: '短剣', icon: '🔪', atkMult: 1.1, rangePlus: 0, speedMult: 0.8, cost: 25, desc: '超高速攻撃' },
  { name: '聖なる盾', icon: '🛡️', atkMult: 1.0, rangePlus: 10, speedMult: 0.95, cost: 15, desc: '堅実な防御型' },
];
const REFINE_MAX = 10;

// 任務定義
const MISSION_DEFS = [
  { name: '草原の小道', icon: '🌿', desc: '初心者向けの訓練任務',
    waves: 10, hpMult: 0.6, speedMult: 0.8, reward: 15, stars: 1, unlock: 0 },
  { name: '古びた街道', icon: '🏘️', desc: '旅路に潜むモンスター',
    waves: 15, hpMult: 0.8, speedMult: 0.9, reward: 25, stars: 2, unlock: 0 },
  { name: '暗黒の森', icon: '🌲', desc: '奥深くに棲む魔物たち',
    waves: 20, hpMult: 1.0, speedMult: 1.0, reward: 40, stars: 3, unlock: 0 },
  { name: '竜の峡谷', icon: '🏔️', desc: '強敵がひしめく険しい谷',
    waves: 25, hpMult: 1.3, speedMult: 1.1, reward: 60, stars: 4, unlock: 1 },
  { name: '魔王の城門', icon: '🏰', desc: '魔王軍の本拠地前線',
    waves: 30, hpMult: 1.6, speedMult: 1.2, reward: 85, stars: 5, unlock: 2 },
  { name: '煉獄の迷宮', icon: '🔥', desc: '灼熱地獄の最深部',
    waves: 35, hpMult: 2.0, speedMult: 1.3, reward: 120, stars: 6, unlock: 3 },
];

// 任務クリアデータ
let missionClears = new Array(MISSION_DEFS.length).fill(false);

function getRefineCost(lv) { return 15 + lv * 20; }
function getRefineRate(lv) { return Math.max(30, 100 - lv * 10); }
function getRefineBonus(lv) {
  return { atkMult: 1 + lv * 0.08, rangePlus: lv * 4, speedMult: 1 - lv * 0.03 };
}

// 永続データ
let weapons = [null, null, null, null]; // 各スロットの装備武器 {type, refine}
let crystals = 50; // 結晶（永続通貨）初期50個
let enhanceLevels = new Array(ALLY_DEFS.length).fill(0); // 各職業の強化Lv (最大10)
const ENHANCE_MAX = 10;

function getEnhanceCost(lv) {
  return 10 + lv * 15;
}

function getEnhanceBonus(lv) {
  return { damageMult: 1 + lv * 0.1, rangePlus: lv * 5, speedMult: 1 - lv * 0.03 };
}

// レベルシステム
const LEVEL_MAX = 30;
let allyLevels = new Array(ALLY_DEFS.length).fill(1); // 各職業のレベル (1〜30)
let allyXP = new Array(ALLY_DEFS.length).fill(0);     // 各職業の累計経験値

function getXPForLevel(lv) {
  // レベルアップに必要な累計XP
  return Math.floor(lv * lv * 10 + lv * 20);
}

function getLevelBonus(lv) {
  const t = lv - 1; // Lv1では0ボーナス
  return { damageMult: 1 + t * 0.03, rangePlus: Math.floor(t * 1.5), speedMult: 1 - t * 0.005 };
}

function addXP(jobIdx, amount) {
  if (allyLevels[jobIdx] >= LEVEL_MAX) return;
  allyXP[jobIdx] += amount;
  // レベルアップチェック
  while (allyLevels[jobIdx] < LEVEL_MAX && allyXP[jobIdx] >= getXPForLevel(allyLevels[jobIdx])) {
    allyLevels[jobIdx]++;
  }
}

// ===== ゲーム状態 =====
let wave, score, gameSpeed, waveDelay;
let core;
let allies, enemies, projectiles, particles;
let selectedAlly;
let waveActive, spawning, spawnTimer, spawnQueue;
let gameOver, victory;
let currentMission = null; // 選択中の任務インデックス
let missionMaxWave = MAX_WAVE;
let missionHpMult = 1;
let missionSpeedMult = 1;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function init() {
  wave = 0;
  score = 0;
  gameSpeed = 1;
  waveDelay = 0; // Wave間の待ち時間カウンタ
  // 任務データ適用
  if (currentMission !== null) {
    const m = MISSION_DEFS[currentMission];
    missionMaxWave = m.waves;
    missionHpMult = m.hpMult;
    missionSpeedMult = m.speedMult;
  } else {
    missionMaxWave = MAX_WAVE;
    missionHpMult = 1;
    missionSpeedMult = 1;
  }
  core = { hp: CORE_MAX_HP, maxHp: CORE_MAX_HP };
  allies = [];
  enemies = [];
  projectiles = [];
  particles = [];
  selectedAlly = null;
  waveActive = false;
  spawning = false;
  spawnTimer = 0;
  spawnQueue = [];
  gameOver = false;
  victory = false;
  sortieKills = 0;

  // 編成に従って味方4人を配置（強化+武器ボーナス適用）
  for (let i = 0; i < formation.length; i++) {
    const defIdx = formation[i];
    const def = ALLY_DEFS[defIdx];
    const pos = ALLY_POSITIONS[i];
    const enh = getEnhanceBonus(enhanceLevels[defIdx]);
    const lvB = getLevelBonus(allyLevels[defIdx]);
    // 武器ボーナス
    const w = weapons[i];
    let wAtkMult = 1, wRangePlus = 0, wSpeedMult = 1;
    if (w) {
      const wDef = WEAPON_DEFS[w.type];
      const rB = getRefineBonus(w.refine);
      wAtkMult = wDef.atkMult * rB.atkMult;
      wRangePlus = wDef.rangePlus + rB.rangePlus;
      wSpeedMult = wDef.speedMult * rB.speedMult;
    }
    allies.push({
      type: defIdx,
      name: def.name,
      icon: def.icon,
      x: pos.x,
      y: pos.y,
      damage: def.damage * enh.damageMult * lvB.damageMult * wAtkMult,
      range: def.range + enh.rangePlus + lvB.rangePlus + wRangePlus,
      speed: def.speed * enh.speedMult * lvB.speedMult * wSpeedMult,
      color: def.color,
      splash: def.splash || 0,
      slow: def.slow || 0,
      cooldown: 0,
      angle: Math.PI,
      attackAnim: 0,
    });
  }

  document.getElementById('game-over-overlay').style.display = 'none';
  document.getElementById('victory-overlay').style.display = 'none';
  // HUDに任務名表示
  if (currentMission !== null) {
    const m = MISSION_DEFS[currentMission];
    document.getElementById('hud-mission-name').textContent = m.icon + ' ' + m.name;
  } else {
    document.getElementById('hud-mission-name').textContent = '';
  }

  buildAllyButtons();
  updateHUD();

  // 戦闘オート: 最初のWaveを自動開始
  waveDelay = 1.5;
}

// ===== UIボタン生成 =====
function buildAllyButtons() {
  const container = document.getElementById('ally-buttons');
  container.innerHTML = '';
  allies.forEach((a, i) => {
    const btn = document.createElement('div');
    btn.className = 'ally-btn';
    btn.onclick = () => selectAlly(i);
    const lv = allyLevels[a.type];
    btn.innerHTML = `
      <div class="ally-icon">${a.icon}</div>
      <div class="ally-name">${a.name} <span style="color:#88ccff;font-size:10px;">Lv.${lv}</span></div>
      <div class="ally-desc">${ALLY_DEFS[a.type].desc}</div>
    `;
    container.appendChild(btn);
  });
}

function selectAlly(idx) {
  selectedAlly = allies[idx] || null;
  // ボタンハイライト
  document.querySelectorAll('.ally-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  updateAllyInfo();
}

// ===== HUD更新 =====
function updateHUD() {
  document.getElementById('core-hp').textContent = Math.ceil(core.hp);
  document.getElementById('core-max-hp').textContent = core.maxHp;
  document.getElementById('wave').textContent = wave;
  document.getElementById('max-wave').textContent = missionMaxWave;
  document.getElementById('score').textContent = score;
}

function updateAllyInfo() {
  const panel = document.getElementById('ally-info');
  if (!selectedAlly) {
    panel.style.display = 'none';
    return;
  }
  const a = selectedAlly;
  panel.style.display = 'block';
  const alv = allyLevels[a.type];
  const axp = allyXP[a.type];
  const nextXP = alv < LEVEL_MAX ? getXPForLevel(alv) : axp;
  document.getElementById('info-name').textContent = `${a.icon} ${a.name} Lv.${alv}`;
  document.getElementById('info-damage').textContent = Math.round(a.damage);
  document.getElementById('info-range').textContent = Math.round(a.range) + 'px';
  document.getElementById('info-speed').textContent = a.speed.toFixed(2) + 's';
  document.getElementById('info-xp').textContent = alv >= LEVEL_MAX ? 'MAX' : axp + '/' + nextXP;
}

function setSpeed(s) {
  gameSpeed = s;
  document.querySelectorAll('.speed-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i + 1) === s);
  });
}

// キャンバスクリックで味方選択
canvas.addEventListener('click', (e) => {
  if (gameOver || victory) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  // 味方をクリックで選択
  let found = -1;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    const dx = mx - a.x;
    const dy = my - a.y;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      found = i;
      break;
    }
  }
  if (found >= 0) {
    selectAlly(found);
  } else {
    selectedAlly = null;
    document.querySelectorAll('.ally-btn').forEach(btn => btn.classList.remove('selected'));
    updateAllyInfo();
  }
});

// ===== ウェーブ（オート進行） =====
function startNextWave() {
  if (waveActive || gameOver || victory) return;
  wave++;
  waveActive = true;
  spawning = true;
  spawnTimer = 0;
  spawnQueue = generateWave(wave);
  updateHUD();
  document.getElementById('auto-status').textContent = '⚔️ Wave ' + wave + ' 戦闘中...';
}

function generateWave(w) {
  const queue = [];
  const baseCount = 5 + Math.floor(w * 1.5);
  const hpMult = (1 + (w - 1) * 0.35) * missionHpMult;
  const speedMult = (1 + Math.min(w * 0.02, 0.6)) * missionSpeedMult;

  for (let i = 0; i < baseCount; i++) {
    let type = 'normal';
    if (w >= 5 && Math.random() < 0.2 + w * 0.01) type = 'fast';
    if (w >= 10 && Math.random() < 0.1 + w * 0.005) type = 'tank';
    if (w >= 15 && Math.random() < 0.05 + w * 0.003) type = 'healer';

    queue.push(createEnemyDef(type, hpMult, speedMult));
  }

  // ボスウェーブ (5の倍数)
  if (w % 5 === 0) {
    queue.push(createEnemyDef('boss', hpMult * 3, speedMult * 0.6));
  }

  return queue;
}

function createEnemyDef(type, hpMult, speedMult) {
  const defs = {
    normal: { hp: 60, speed: 50, radius: 12, color: '#cc3333', gold: 5, score: 10, name: 'ゴブリン', emoji: '👹' },
    fast:   { hp: 35, speed: 90, radius: 10, color: '#33cc33', gold: 8, score: 15, name: 'コボルト', emoji: '🐺' },
    tank:   { hp: 200, speed: 30, radius: 16, color: '#3366cc', gold: 15, score: 25, name: 'オーガ', emoji: '👻' },
    healer: { hp: 80, speed: 45, radius: 12, color: '#cc33cc', gold: 12, score: 20, name: 'ダークプリースト', emoji: '🧙' },
    boss:   { hp: 500, speed: 25, radius: 22, color: '#ff6600', gold: 50, score: 100, name: 'ドラゴン', emoji: '🐲' },
  };
  const d = defs[type];
  return {
    type,
    hp: Math.floor(d.hp * hpMult),
    maxHp: Math.floor(d.hp * hpMult),
    speed: d.speed * speedMult,
    baseSpeed: d.speed * speedMult,
    radius: d.radius,
    color: d.color,
    gold: d.gold,
    score: d.score,
    name: d.name,
    emoji: d.emoji,
    damage: type === 'boss' ? 3 : (type === 'tank' ? 2 : 1),
    attackSpeed: type === 'fast' ? 0.8 : 1.2,
    attackDamage: type === 'boss' ? 25 : (type === 'tank' ? 15 : 8),
  };
}

function spawnEnemy(def) {
  // 中央付近にランダムにばらけて出現
  const centerY = CORE_Y;
  enemies.push({
    ...def,
    x: SPAWN_X,
    y: centerY + (Math.random() - 0.5) * 80,
    slowTimer: 0,
    _slowAmount: 0,
    alive: true,
    attackCooldown: 0,
    targetAlly: null,
  });
}

// ===== パーティクル =====
function createParticle(x, y, color) {
  const angle = Math.random() * Math.PI * 2;
  const spd = 1 + Math.random() * 3;
  return {
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    life: 0.5 + Math.random() * 0.5,
    maxLife: 0.5 + Math.random() * 0.5,
    color,
    size: 2 + Math.random() * 3,
  };
}

// ===== メインループ =====
let lastTime = 0;
let loopId = 0;

function gameLoop(timestamp) {
  const rawDt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const dt = rawDt * gameSpeed;

  if (!gameOver && !victory) {
    update(dt);
  }
  render();
  loopId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // スポーン
  if (spawning && spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(spawnQueue.shift());
      spawnTimer = 0.5;
    }
    if (spawnQueue.length === 0) spawning = false;
  }

  // Wave間のディレイ（オート進行）
  if (waveDelay > 0 && !waveActive && !gameOver && !victory) {
    waveDelay -= dt;
    if (waveDelay <= 0) {
      startNextWave();
    }
  }

  // ウェーブ終了チェック → 次Waveを自動開始
  if (waveActive && !spawning && enemies.length === 0) {
    waveActive = false;
    // ウェーブ間でコアHP少し回復
    core.hp = Math.min(core.maxHp, core.hp + core.maxHp * 0.05);
    updateHUD();

    if (wave >= missionMaxWave) {
      victory = true;
      let reward = Math.floor(wave * 3 + score * 0.02);
      // 任務ボーナス報酬
      if (currentMission !== null) {
        const m = MISSION_DEFS[currentMission];
        reward += m.reward;
        if (!missionClears[currentMission]) {
          missionClears[currentMission] = true;
          reward += m.reward; // 初回クリアボーナス
        }
      }
      crystals += reward;
      // クリアXPボーナス
      const clearXP = Math.floor(wave * 5 + score * 0.1);
      const lvBefore = formation.map(f => allyLevels[f]);
      for (let i = 0; i < formation.length; i++) {
        addXP(formation[i], clearXP);
      }
      const lvAfter = formation.map(f => allyLevels[f]);
      document.getElementById('final-score2').textContent = score;
      document.getElementById('victory-reward').textContent = reward;
      showXPResult('victory-xp-result', lvBefore, lvAfter, clearXP);
      document.getElementById('victory-overlay').style.display = 'flex';
    } else {
      // 次Waveまで短い待機
      document.getElementById('auto-status').textContent = '🔄 次のWaveへ...';
      waveDelay = 1.5;
    }
  }

  // 敵移動 & コア攻撃
  for (const e of enemies) {
    if (!e.alive) continue;

    // スロー処理
    let spd = e.baseSpeed;
    if (e.slowTimer > 0) {
      spd *= (1 - (e._slowAmount || 0.3));
      e.slowTimer -= dt;
    }
    e.speed = spd;

    // コアに到達したら攻撃
    if (e.x >= CORE_X - 20) {
      e.x = CORE_X - 20;
      e.attackCooldown -= dt;
      if (e.attackCooldown <= 0) {
        core.hp -= e.attackDamage;
        e.attackCooldown = e.attackSpeed;
        for (let i = 0; i < 3; i++) {
          particles.push(createParticle(CORE_X, CORE_Y, '#ff4444'));
        }
        if (core.hp <= 0) {
          core.hp = 0;
          gameOver = true;
          let reward = Math.floor(wave * 2 + score * 0.01);
          // 任務敗北でも難易度に応じた少量報酬
          if (currentMission !== null) {
            reward += Math.floor(MISSION_DEFS[currentMission].reward * 0.3);
          }
          crystals += reward;
          // 敗北時XP（少なめ）
          const defeatXP = Math.floor(wave * 3 + score * 0.05);
          const lvBefore = formation.map(f => allyLevels[f]);
          for (let fi = 0; fi < formation.length; fi++) {
            addXP(formation[fi], defeatXP);
          }
          const lvAfter = formation.map(f => allyLevels[f]);
          document.getElementById('final-wave').textContent = wave;
          document.getElementById('final-score').textContent = score;
          document.getElementById('defeat-reward').textContent = reward;
          showXPResult('defeat-xp-result', lvBefore, lvAfter, defeatXP);
          document.getElementById('game-over-overlay').style.display = 'flex';
        }
        updateHUD();
      }
    } else {
      // 右へ移動
      e.x += spd * dt;
    }

    // ヒーラー: 周囲の敵を回復
    if (e.type === 'healer' && e.alive) {
      for (const other of enemies) {
        if (other === e || !other.alive) continue;
        const hd = Math.sqrt((other.x - e.x) ** 2 + (other.y - e.y) ** 2);
        if (hd < 100) {
          other.hp = Math.min(other.maxHp, other.hp + 15 * dt);
        }
      }
    }
  }

  // 死んだ敵除去
  enemies = enemies.filter(e => e.alive);

  // 味方攻撃
  for (const a of allies) {
    a.cooldown -= dt;
    if (a.attackAnim > 0) a.attackAnim -= dt;
    if (a.cooldown > 0) continue;

    // ターゲット探索（射程内で最も近い敵）
    let target = null;
    let bestDist = Infinity;

    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - a.x;
      const dy = e.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= a.range && dist < bestDist) {
        bestDist = dist;
        target = e;
      }
    }

    if (target) {
      a.cooldown = a.speed;
      a.angle = Math.atan2(target.y - a.y, target.x - a.x);
      a.attackAnim = 0.15;

      projectiles.push({
        x: a.x, y: a.y,
        tx: target.x, ty: target.y,
        target,
        damage: a.damage,
        splash: a.splash || 0,
        slow: a.slow || 0,
        speed: 400,
        color: a.color,
        alive: true,
      });
    }
  }

  // 弾移動
  for (const p of projectiles) {
    if (!p.alive) continue;
    if (p.target && p.target.alive) {
      p.tx = p.target.x;
      p.ty = p.target.y;
    }
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const move = p.speed * dt;

    if (dist <= move) {
      p.alive = false;
      if (p.splash > 0) {
        for (const e of enemies) {
          if (!e.alive) continue;
          const sd = Math.sqrt((e.x - p.tx) ** 2 + (e.y - p.ty) ** 2);
          if (sd <= p.splash) {
            dealDamage(e, p.damage * (1 - sd / p.splash * 0.5));
            if (p.slow > 0) {
              e.slowTimer = 1.5;
              e._slowAmount = p.slow;
            }
          }
        }
        for (let i = 0; i < 8; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      } else {
        if (p.target && p.target.alive) {
          dealDamage(p.target, p.damage);
          if (p.slow > 0) {
            p.target.slowTimer = 1.5;
            p.target._slowAmount = p.slow;
          }
        }
        for (let i = 0; i < 4; i++) {
          particles.push(createParticle(p.tx, p.ty, p.color));
        }
      }
    } else {
      p.x += (dx / dist) * move;
      p.y += (dy / dist) * move;
    }
  }

  projectiles = projectiles.filter(p => p.alive);

  // パーティクル更新
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

let sortieKills = 0; // 出撃中の撃破数

function dealDamage(enemy, dmg) {
  enemy.hp -= dmg;
  if (enemy.hp <= 0 && enemy.alive) {
    enemy.alive = false;
    score += enemy.score;
    sortieKills++;
    updateHUD();
    for (let i = 0; i < 12; i++) {
      particles.push(createParticle(enemy.x, enemy.y, enemy.color));
    }
    // 編成中の全職業にXP付与（撃破XP）
    const xpGain = Math.floor(enemy.score * 0.5 + 2);
    for (let i = 0; i < formation.length; i++) {
      addXP(formation[i], xpGain);
    }
  }
}

function showXPResult(elementId, lvBefore, lvAfter, bonusXP) {
  const el = document.getElementById(elementId);
  let html = '<div style="color:#88ccff;">📊 経験値 +' + bonusXP + ' (ボーナス)</div>';
  html += '<div style="display:flex; gap:12px; justify-content:center; margin-top:6px; flex-wrap:wrap;">';
  for (let i = 0; i < formation.length; i++) {
    const def = ALLY_DEFS[formation[i]];
    const before = lvBefore[i];
    const after = lvAfter[i];
    const leveled = after > before;
    html += '<div style="text-align:center;">' +
      '<div>' + def.icon + ' ' + def.name + '</div>' +
      '<div style="color:' + (leveled ? '#ffdd44' : '#aaa') + ';">Lv.' + before +
      (leveled ? ' → <span style="color:#44ff44;font-weight:bold;">Lv.' + after + ' UP!</span>' : '') +
      '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// ===== 描画 =====
function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // 空（グラデーション）
  const skyGrad = ctx.createLinearGradient(0, 0, 0, LANE_TOP);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(1, '#B0E0E6');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CANVAS_W, LANE_TOP);

  // 太陽
  ctx.beginPath();
  ctx.arc(650, 35, 25, 0, Math.PI * 2);
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(650, 35, 30, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.lineWidth = 1;

  // 雲
  drawCloud(100, 25, 40);
  drawCloud(300, 40, 30);
  drawCloud(500, 20, 35);

  // 草原の背景
  const grassGrad = ctx.createLinearGradient(0, LANE_TOP, 0, CANVAS_H);
  grassGrad.addColorStop(0, '#4CAF50');
  grassGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, LANE_TOP, CANVAS_W, CANVAS_H - LANE_TOP);

  // 中央の道を描画
  const pathY = CORE_Y - 50;
  const pathH = 100;
  ctx.fillStyle = 'rgba(139, 119, 80, 0.3)';
  ctx.fillRect(0, pathY, CANVAS_W, pathH);
  // 道の縁線
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(0, pathY);
  ctx.lineTo(CANVAS_W, pathY);
  ctx.moveTo(0, pathY + pathH);
  ctx.lineTo(CANVAS_W, pathY + pathH);
  ctx.stroke();
  ctx.setLineDash([]);
  // 草の装飾
  for (let gx = 20; gx < CANVAS_W; gx += 60) {
    const gy1 = pathY - 5 + Math.sin(gx * 0.1) * 3;
    const gy2 = pathY + pathH + 5 + Math.sin(gx * 0.1 + 2) * 3;
    ctx.fillStyle = '#66BB6A';
    ctx.fillText('🌿', gx, gy1);
    ctx.fillText('🌿', gx, gy2);
  }

  // コア描画
  // コア台座
  ctx.beginPath();
  ctx.arc(CORE_X, CORE_Y, 28, 0, Math.PI * 2);
  const coreGrad = ctx.createRadialGradient(CORE_X, CORE_Y, 5, CORE_X, CORE_Y, 28);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, '#66ddff');
  coreGrad.addColorStop(1, '#2244aa');
  ctx.fillStyle = coreGrad;
  ctx.fill();
  ctx.strokeStyle = '#aaeeff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.lineWidth = 1;
  // コアアイコン
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💎', CORE_X, CORE_Y);
  // コアHPバー
  const coreBarW = 60;
  const coreBarH = 6;
  const coreBarX = CORE_X - coreBarW / 2;
  const coreBarY = CORE_Y + 34;
  ctx.fillStyle = '#333';
  ctx.fillRect(coreBarX, coreBarY, coreBarW, coreBarH);
  const coreRatio = Math.max(0, core.hp / core.maxHp);
  ctx.fillStyle = coreRatio > 0.5 ? '#44ccff' : coreRatio > 0.25 ? '#cccc44' : '#cc4444';
  ctx.fillRect(coreBarX, coreBarY, coreBarW * coreRatio, coreBarH);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(coreBarX, coreBarY, coreBarW, coreBarH);
  // コアラベル
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#aaeeff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('CORE', CORE_X, CORE_Y - 32);

  // 味方射程（選択時）
  if (selectedAlly) {
    const a = selectedAlly;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.range, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
    ctx.fill();
    ctx.lineWidth = 1;
  }

  // 敵描画
  for (const e of enemies) {
    if (!e.alive) continue;

    // 影
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.radius + 2, e.radius * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();

    // 本体（円）
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.lineWidth = 1;

    // 絵文字
    ctx.font = `${e.radius * 1.4}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(e.emoji, e.x, e.y);

    // スロー表示
    if (e.slowTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100, 100, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    // HPバー
    const barW = e.radius * 2.5;
    const barH = 4;
    const barX = e.x - barW / 2;
    const barY = e.y - e.radius - 10;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#44cc44' : ratio > 0.25 ? '#cccc44' : '#cc4444';
    ctx.fillRect(barX, barY, barW * ratio, barH);

    // ボスには名前表示
    if (e.type === 'boss') {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ff8800';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(e.name, e.x, e.y - e.radius - 14);
    }
  }

  // 味方描画
  for (const a of allies) {
    // 影
    ctx.beginPath();
    ctx.ellipse(a.x, a.y + 22, 16, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();

    // 攻撃アニメーション（ちょっと前に出る）
    let drawX = a.x;
    if (a.attackAnim > 0) {
      drawX -= 8 * (a.attackAnim / 0.15);
    }

    // 本体（丸い台座）
    ctx.beginPath();
    ctx.arc(drawX, a.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = a.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    // アイコン
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(a.icon, drawX, a.y);

    // 選択ハイライト
    if (selectedAlly === a) {
      ctx.beginPath();
      ctx.arc(drawX, a.y, 24, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  // 弾描画
  for (const p of projectiles) {
    if (!p.alive) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 軌跡
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (dx/d)*10, p.y - (dy/d)*10);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  // パーティクル描画
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // ステータスバー（下部）
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, CANVAS_H - 25, CANVAS_W, 25);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const aliveEnemies = enemies.filter(e => e.alive).length;
  ctx.fillText(`コアHP: ${Math.ceil(core.hp)}/${core.maxHp}  |  敵: ${aliveEnemies}体  |  味方: ${allies.length}人`, 10, CANVAS_H - 12);
}

function drawCloud(x, y, size) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

// ===== 強化画面 =====
let enhanceSelected = -1;

function openEnhance() {
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('enhance-screen').style.display = 'flex';
  enhanceSelected = -1;
  renderEnhance();
  setTimeout(fitToScreen, 0);
}

function closeEnhance() {
  document.getElementById('enhance-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'flex';
  updateMenuCrystal();
  setTimeout(fitToScreen, 0);
}

function updateMenuCrystal() {
  document.getElementById('menu-crystal-count').textContent = crystals;
}

function renderEnhance() {
  document.getElementById('enhance-crystal-count').textContent = crystals;
  const grid = document.getElementById('enhance-grid');
  grid.innerHTML = '';
  for (let j = 0; j < ALLY_DEFS.length; j++) {
    const def = ALLY_DEFS[j];
    const lv = enhanceLevels[j];
    const card = document.createElement('div');
    card.className = 'enhance-card' + (enhanceSelected === j ? ' selected' : '');
    card.onclick = () => { enhanceSelected = (enhanceSelected === j) ? -1 : j; renderEnhance(); };
    let pips = '';
    for (let p = 0; p < ENHANCE_MAX; p++) {
      pips += '<div class="enh-pip' + (p < lv ? ' filled' : '') + '"></div>';
    }
    card.innerHTML =
      '<div class="enh-icon">' + def.icon + '</div>' +
      '<div class="enh-name">' + def.name + '</div>' +
      '<div class="enh-level">強化Lv.' + lv + '</div>' +
      '<div class="enh-level-bar">' + pips + '</div>';
    grid.appendChild(card);
  }
  renderEnhanceDetail();
}

function renderEnhanceDetail() {
  const detail = document.getElementById('enhance-detail');
  if (enhanceSelected < 0) {
    detail.style.display = 'none';
    return;
  }
  detail.style.display = 'block';
  const j = enhanceSelected;
  const def = ALLY_DEFS[j];
  const lv = enhanceLevels[j];
  const cur = getEnhanceBonus(lv);
  const maxed = lv >= ENHANCE_MAX;
  const cost = maxed ? 0 : getEnhanceCost(lv);
  const nxt = maxed ? cur : getEnhanceBonus(lv + 1);

  const dmgCur = Math.round(def.damage * cur.damageMult);
  const rngCur = Math.round(def.range + cur.rangePlus);
  const spdCur = (def.speed * cur.speedMult).toFixed(2);
  const dmgNxt = Math.round(def.damage * nxt.damageMult);
  const rngNxt = Math.round(def.range + nxt.rangePlus);
  const spdNxt = (def.speed * nxt.speedMult).toFixed(2);

  let statsHtml =
    '<div class="enh-stats">' +
      '<div class="enh-stat-item"><div class="enh-stat-label">攻撃力</div><div>' + dmgCur +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + dmgNxt + '</span>') + '</div></div>' +
      '<div class="enh-stat-item"><div class="enh-stat-label">射程</div><div>' + rngCur +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + rngNxt + '</span>') + '</div></div>' +
      '<div class="enh-stat-item"><div class="enh-stat-label">速度</div><div>' + spdCur + 's' +
        (maxed ? '' : ' <span class="enh-stat-arrow">→ ' + spdNxt + 's</span>') + '</div></div>' +
    '</div>';

  let btnHtml = maxed
    ? '<div style="color:#ffcc44;font-size:14px;font-weight:bold;">MAX</div>'
    : '<button id="enhance-do-btn" onclick="doEnhance()"' +
      (crystals < cost ? ' disabled' : '') +
      '>強化する (💎' + cost + ')</button>';

  detail.innerHTML =
    '<h3>' + def.icon + ' ' + def.name + ' Lv.' + lv + (maxed ? ' MAX' : '') + '</h3>' +
    statsHtml + btnHtml;
}

function doEnhance() {
  if (enhanceSelected < 0) return;
  const j = enhanceSelected;
  const lv = enhanceLevels[j];
  if (lv >= ENHANCE_MAX) return;
  const cost = getEnhanceCost(lv);
  if (crystals < cost) return;
  crystals -= cost;
  enhanceLevels[j]++;
  renderEnhance();
}

let weaponSelectedSlot = -1;

function openWeapon() {
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('weapon-screen').style.display = 'flex';
  weaponSelectedSlot = -1;

  setTimeout(fitToScreen, 0);

function closeWeapon() {

  document.getElementById('menu-screen').style.display = 'flex';
  updateMenuCrystal();
  setTimeout(fitToScreen, 0);
}

function renderWeapon() {
  document.getElementById('weapon-crystal-count').textContent = crystals;
  const container = document.getElementById('weapon-slots');
  container.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const jobDef = ALLY_DEFS[formation[i]];
    const w = weapons[i];
    const slot = document.createElement('div');
    slot.className = 'weapon-slot' + (weaponSelectedSlot === i ? ' selected' : '');
    slot.onclick = () => { weaponSelectedSlot = (weaponSelectedSlot === i) ? -1 : i; renderWeapon(); };
    if (w) {
      const wDef = WEAPON_DEFS[w.type];
      slot.innerHTML =
        '<div class="ws-job">' + jobDef.icon + ' ' + jobDef.name + '</div>' +
        '<div class="ws-icon">' + wDef.icon + '</div>' +
        '<div class="ws-name">' + wDef.name + '</div>' +
        '<div class="ws-refine">+' + w.refine + '</div>';
    } else {
      slot.innerHTML =
        '<div class="ws-job">' + jobDef.icon + ' ' + jobDef.name + '</div>' +
        '<div class="ws-empty">武器なし</div>';
    }
    container.appendChild(slot);
  }
  renderWeaponAction();
}

function renderWeaponAction() {
  const panel = document.getElementById('weapon-action');
  if (weaponSelectedSlot < 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const i = weaponSelectedSlot;
  const w = weapons[i];

  if (!w) {
    // 武器作成モード
    let html = '<h3>⚒️ 武器作成</h3><div id="weapon-craft-list">';
    for (let j = 0; j < WEAPON_DEFS.length; j++) {
      const d = WEAPON_DEFS[j];
      html += '<button class="craft-btn" onclick="craftWeapon(' + j + ')"' +
        (crystals < d.cost ? ' disabled' : '') + '>' +
        '<div class="craft-icon">' + d.icon + '</div>' +
        '<div class="craft-name">' + d.name + '</div>' +
        '<div class="craft-cost">💎' + d.cost + '</div>' +
        '</button>';
    }
    html += '</div>';
    panel.innerHTML = html;
  } else {
    // 精錬モード
    const wDef = WEAPON_DEFS[w.type];
    const lv = w.refine;
    const maxed = lv >= REFINE_MAX;
    const cost = maxed ? 0 : getRefineCost(lv);
    const rate = maxed ? 0 : getRefineRate(lv);
    const curB = getRefineBonus(lv);
    const nxtB = maxed ? curB : getRefineBonus(lv + 1);

    const atkCur = Math.round(wDef.atkMult * curB.atkMult * 100);
    const rngCur = Math.round(wDef.rangePlus + curB.rangePlus);
    const spdCur = Math.round(wDef.speedMult * curB.speedMult * 100);
    const atkNxt = Math.round(wDef.atkMult * nxtB.atkMult * 100);
    const rngNxt = Math.round(wDef.rangePlus + nxtB.rangePlus);
    const spdNxt = Math.round(wDef.speedMult * nxtB.speedMult * 100);

    let html = '<div id="weapon-refine-panel">' +
      '<h3>' + wDef.icon + ' ' + wDef.name + ' +' + lv + (maxed ? ' MAX' : '') + '</h3>' +
      '<div class="refine-stats">' +
        '<div><div class="refine-stat-label">攻撃倍率</div>' + atkCur + '%' +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + atkNxt + '%</span>') + '</div>' +
        '<div><div class="refine-stat-label">射程+</div>' + rngCur +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + rngNxt + '</span>') + '</div>' +
        '<div><div class="refine-stat-label">速度倍率</div>' + spdCur + '%' +
          (maxed ? '' : ' <span class="refine-arrow">→ ' + spdNxt + '%</span>') + '</div>' +
      '</div>';

    if (maxed) {
      html += '<div style="color:#ffcc44;font-weight:bold;">精錬MAX!</div>';
    } else {
      html += '<button class="refine-btn" onclick="refineWeapon()"' +
        (crystals < cost ? ' disabled' : '') +
        '>精錬する (💎' + cost + ')</button>' +
        '<div class="refine-rate">成功率: <span style="color:' +
        (rate >= 70 ? '#44ff44' : rate >= 50 ? '#ffcc44' : '#ff6644') +
        '">' + rate + '%</span></div>';
    }
    html += '<div id="refine-result"></div>';
    html += '<button class="discard-btn" onclick="discardWeapon()">武器を破棄</button>';
    html += '</div>';
    panel.innerHTML = html;
  }
}

function craftWeapon(typeIdx) {
  if (weaponSelectedSlot < 0) return;
  const d = WEAPON_DEFS[typeIdx];
  if (crystals < d.cost) return;
  crystals -= d.cost;
  weapons[weaponSelectedSlot] = { type: typeIdx, refine: 0 };
  renderWeapon();
}

function refineWeapon() {
  if (weaponSelectedSlot < 0) return;
  const w = weapons[weaponSelectedSlot];
  if (!w || w.refine >= REFINE_MAX) return;
  const cost = getRefineCost(w.refine);
  if (crystals < cost) return;
  crystals -= cost;
  const rate = getRefineRate(w.refine);
  const success = Math.random() * 100 < rate;
  if (success) {
    w.refine++;
    renderWeapon();
    document.getElementById('refine-result').innerHTML =
      '<span style="color:#44ff44;">✨ 精錬成功！ +' + w.refine + ' に強化！</span>';
  } else {
    renderWeapon();
    document.getElementById('refine-result').innerHTML =
      '<span style="color:#ff4444;">💥 精錬失敗... 結晶を失った</span>';
  }
}

function discardWeapon() {
  if (weaponSelectedSlot < 0) return;
  weapons[weaponSelectedSlot] = null;
  renderWeapon();
}

  const m = MISSION_DEFS[idx];
  if (m.unlock === 0) return true;
  // unlock = N means need to clear mission N-1
  return missionClears[m.unlock - 1];
}

  const list = document.getElementById('mission-list');
  list.innerHTML = '';
  for (let i = 0; i < MISSION_DEFS.length; i++) {
    const m = MISSION_DEFS[i];
    const unlocked = isMissionUnlocked(i);
    const card = document.createElement('div');
    card.className = 'mission-card' + (missionSelected === i ? ' selected' : '') + (!unlocked ? ' locked' : '');
    if (unlocked) {
      card.onclick = () => { missionSelected = (missionSelected === i) ? -1 : i; renderMission(); };
    }

    let starsHtml = '<div class="mc-difficulty">';
    for (let s = 0; s < 6; s++) {
      starsHtml += '<span class="mc-star ' + (s < m.stars ? 'filled' : 'empty') + '">★</span>';
    }
    starsHtml += '</div>';

    card.innerHTML =
      '<div class="mc-icon">' + m.icon + '</div>' +
      '<div class="mc-name">' + (unlocked ? m.name : '???') + '</div>' +
      '<div class="mc-desc">' + (unlocked ? m.desc : '前の任務をクリアしよう') + '</div>' +

        '<span>' + m.waves + ' Wave</span>' +
        '<span>💎 ' + m.reward + ' (初回x2)</span>' +

  detail.innerHTML =

      '<div class="md-stat-item"><div class="md-stat-label">敵速度倍率</div><div>x' + m.speedMult.toFixed(1) + '</div></div>' +
      '<div class="md-stat-item"><div class="md-stat-label">難易度</div><div style="color:' + diffColor + '">' + diffLabel + '</div></div>' +

// ===== 画面フィット =====
function fitToScreen() {
  const wrapper = document.getElementById('app-wrapper');
  const isMobile = window.innerWidth < 960;

  if (isMobile) {
    // 一旦transformをリセットして実際の幅・高さを計測
    wrapper.style.transform = 'none';
    wrapper.style.marginBottom = '0';
    const actualW = wrapper.scrollWidth;
    const actualH = wrapper.scrollHeight;
    const s = window.innerWidth / actualW;
    wrapper.style.transform = 'scale(' + s + ')';
    wrapper.style.transformOrigin = 'top left';
    wrapper.style.marginTop = '0';
    wrapper.style.marginBottom = -(actualH - actualH * s) + 'px';
  } else {
    const contentW = 960;
    const contentH = 640;
    const scaleX = window.innerWidth / contentW;
    const scaleY = window.innerHeight / contentH;
    const s = Math.min(scaleX, scaleY, 1);
    wrapper.style.transform = 'scale(' + s + ')';
    wrapper.style.transformOrigin = 'top center';
    const scaledH = contentH * s;
    wrapper.style.marginBottom = -(contentH - scaledH) + 'px';
    wrapper.style.marginTop = Math.max(0, (window.innerHeight - scaledH) / 2) + 'px';
  }
}

window.addEventListener('resize', fitToScreen);
fitToScreen();
